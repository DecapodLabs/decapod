# Prefer Bazel's official mirror; preserve the original pinned archive integrity.
# GitHub's explicit download query and original URL remain fallback routes.
rewrite github\.com/([^?]+/releases/download/[^?]+) https://mirror.bazel.build/github.com/$1
rewrite github\.com/([^?]+/releases/download/[^?]+) https://github.com/$1?download=1
rewrite github\.com/([^?]+/releases/download/[^?]+) https://github.com/$1
