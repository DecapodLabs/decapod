name: Prepare shared source-CI profile
description: Compile the reviewed direct-argv catalog; optionally run one measured source check
inputs:
  check:
    description: Finite source check ID; empty compiles only (no readiness claim)
    required: false
    default: ''
  base:
    description: Independently bound immutable logical base B
    required: false
  head:
    description: Independently bound immutable authored head H; ordinary PR checkout may be merge V
    required: false
  snapshot:
    description: Verified pre-normalization checkout S; transport parent/message binding is independently verified
    required: false
  validation-head:
    description: Trusted actual execution revision V, H for snapshot transport
    required: false
  tree:
    description: Actual execution tree T; normalized transport requires identical H/S trees
    required: false
  provider:
    description: Native provider namespace, github or buildkite
    required: false
  run-id:
    description: Native GitHub run ID or Buildkite build UUID
    required: false
  run-attempt:
    description: GitHub run attempt or Buildkite retry count
    required: false
  job-id:
    description: GitHub logical GITHUB_JOB or native Buildkite job UUID
    required: false
  step-key:
    description: Native Buildkite pipeline step key; empty for GitHub
    required: false
  expected-profile-sha256:
    description: Independently reviewed sha256-prefixed source profile digest
    required: false
  expected-invocation-sha256:
    description: Independently reviewed sha256-prefixed invocation digest for this check
    required: false
  expected-toolchain-sha256:
    description: Optional independently frozen preparation digest; otherwise freeze source-validated preparation before running
    required: false
  evidence-directory:
    description: Fresh directory whose parent exists; upload it even on failure
    required: false
outputs:
  evidence-directory:
    description: Requested measured evidence directory; caller owns authenticated artifact upload
    value: ${{ inputs.evidence-directory }}
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.96.1
    - name: Compile shared source-CI profile
      shell: bash
      env:
        SOURCE_INPUT_BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        umask 077
        # The context action captured B before this carrier runs. Inputs cannot
        # substitute a branch name or another immutable executor revision.
        base="${SOURCE_CI_BASE:-}"
        if [[ -n "${SOURCE_INPUT_BASE:-}" && "$SOURCE_INPUT_BASE" != "$base" ]]; then
          echo 'Requested base differs from verified immutable CI context' >&2
          exit 1
        fi
        while IFS= read -r name; do
          unset "$name"
        done < <(compgen -e GIT_ || true)
        export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
        export GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0 GIT_NO_REPLACE_OBJECTS=1
        git_local() {
          git --no-replace-objects -c core.hooksPath=/dev/null \
            -c core.fsmonitor=false -c core.untrackedCache=false "$@"
        }
        subject_root="$(git_local rev-parse --show-toplevel)"
        subject_root="$(cd "$subject_root" && pwd -P)"
        runner_root="$(cd "${RUNNER_TEMP:?}" && pwd -P)"
        cd "$subject_root"
        case "$runner_root/" in
          "$subject_root/"*) echo 'Executor scratch must be outside the subject checkout' >&2; exit 1 ;;
        esac
        supported=false
        if [[ -n "$base" ]]; then
          [[ "$base" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$base" =~ [1-9a-f] ]]
          test "$(git_local cat-file -t "$base")" = commit
          # Equal endpoints are an ordinary no-change branch event, not a
          # candidate proof. Preserve its existing unmeasured source behavior.
          if [[ "$base" != "${SOURCE_CI_HEAD:?Missing verified authored head}" ]]; then
            entry="$(git_local ls-tree "$base" -- assets/tools/source_ci_custody.rs)"
            if [[ -n "$entry" ]]; then
              [[ "$entry" =~ ^100644[[:space:]]blob[[:space:]]([0-9a-f]{40}|[0-9a-f]{64})$'\t'assets/tools/source_ci_custody.rs$ ]]
              blob="${BASH_REMATCH[1]}"
              test "$(git_local cat-file -s "$blob")" -le 4194304
              probe="$(mktemp "$runner_root/source-ci-protocol.XXXXXX")"
              git_local cat-file blob "$blob" > "$probe"
              if grep -Fqx 'pub const DUAL_ROOT_SCHEMA: &str = "decapod.source-ci.dual-root.v1";' "$probe"; then
                supported=true
              else
                probe_status=$?
                # Only an honest absent declaration permits rollout fallback.
                test "$probe_status" = 1
              fi
              rm -- "$probe"
            fi
          fi
        fi
        if [[ "$supported" != true ]]; then
          # One-time rollout compatibility only. The independent collector
          # still requires H's complete closure to match its embedded contract.
          rustc --edition=2024 -O assets/tools/source_ci_profile.rs -o "$RUNNER_TEMP/source-ci-profile"
          exit 0
        fi
        executor_parent="$(mktemp -d "$runner_root/source-ci-executor.XXXXXX")"
        executor_root="$executor_parent/repo"
        executor_tree="$(git_local rev-parse --verify "$base^{tree}")"
        git_local worktree add --quiet --detach "$executor_root" "$base"
        test "$(git_local -C "$executor_root" rev-parse --verify HEAD)" = "$base"
        test "$(git_local -C "$executor_root" rev-parse --verify 'HEAD^{tree}')" = "$executor_tree"
        executor="$executor_parent/source-ci-profile"
        # Once R advertises support, any staging/compilation/verification error
        # is terminal. Never retry using candidate helper bytes.
        rustc --edition=2024 -O "$executor_root/assets/tools/source_ci_profile.rs" -o "$executor"
        # Keep the familiar entrypoint, with frozen explicit argv rather than
        # an ambient authority environment. Helpers package current_exe, so
        # downstream workers receive the actual R binary, never this wrapper.
        {
          printf '#!/usr/bin/env bash\nset -euo pipefail\n'
          printf 'executor=%q\nroot=%q\nrevision=%q\ntree=%q\n' \
            "$executor" "$executor_root" "$base" "$executor_tree"
          cat <<'WRAPPER'
        mode="${1:?Missing source-CI mode}"
        case "$mode" in
          run-ci|prepare-evidence|run-evidence)
            shift
            exec "$executor" "$mode" \
              --execution-context decapod.source-ci.dual-root.v1 \
              --executor-root "$root" --executor-revision "$revision" --executor-tree "$tree" "$@"
            ;;
          *) exec "$executor" "$@" ;;
        esac
        WRAPPER
        } > "$RUNNER_TEMP/source-ci-profile"
        chmod 700 "$RUNNER_TEMP/source-ci-profile"
    - name: Execute reviewed source check with measured custody
      if: inputs.check != ''
      shell: bash
      env:
        SOURCE_CHECK: ${{ inputs.check }}
        SOURCE_BASE: ${{ inputs.base }}
        SOURCE_HEAD: ${{ inputs.head }}
        SOURCE_SNAPSHOT: ${{ inputs.snapshot }}
        SOURCE_VALIDATION_HEAD: ${{ inputs.validation-head }}
        SOURCE_TREE: ${{ inputs.tree }}
        SOURCE_PROVIDER: ${{ inputs.provider }}
        SOURCE_RUN_ID: ${{ inputs.run-id }}
        SOURCE_RUN_ATTEMPT: ${{ inputs.run-attempt }}
        SOURCE_JOB_ID: ${{ inputs.job-id }}
        SOURCE_STEP_KEY: ${{ inputs.step-key }}
        SOURCE_EXPECTED_PROFILE: ${{ inputs.expected-profile-sha256 }}
        SOURCE_EXPECTED_INVOCATION: ${{ inputs.expected-invocation-sha256 }}
        SOURCE_EXPECTED_TOOLCHAIN: ${{ inputs.expected-toolchain-sha256 }}
        SOURCE_EVIDENCE: ${{ inputs.evidence-directory }}
      run: |
        # Freeze source-validated preparation before any substantive check. The
        # collector must authenticate both manifests and this reviewed ordering.
        umask 077
        mkdir -- "$SOURCE_EVIDENCE"
        context=(
          --check "$SOURCE_CHECK" --base "$SOURCE_BASE" --head "$SOURCE_HEAD"
          --snapshot "$SOURCE_SNAPSHOT" --validation-head "$SOURCE_VALIDATION_HEAD"
          --tree "$SOURCE_TREE" --provider "$SOURCE_PROVIDER" --run-id "$SOURCE_RUN_ID"
          --run-attempt "$SOURCE_RUN_ATTEMPT" --job-id "$SOURCE_JOB_ID"
          --step-key "$SOURCE_STEP_KEY" --expected-profile-sha256 "$SOURCE_EXPECTED_PROFILE"
          --expected-invocation-sha256 "$SOURCE_EXPECTED_INVOCATION"
        )
        "$RUNNER_TEMP/source-ci-profile" prepare-evidence "${context[@]}" \
          --evidence-dir "$SOURCE_EVIDENCE/preparation"
        frozen_toolchain=$(python3 - "$SOURCE_EVIDENCE/preparation/preparation.json" <<'PY'
        import json, sys
        with open(sys.argv[1], encoding="utf-8") as source:
            preparation = json.load(source)
        assert preparation["preparation_complete"] is True
        print(preparation["toolchain_digest"])
        PY
        )
        if [[ -n "$SOURCE_EXPECTED_TOOLCHAIN" && "$SOURCE_EXPECTED_TOOLCHAIN" != "$frozen_toolchain" ]]; then
          echo 'Prepared toolchain differs from independently frozen expectation' >&2
          exit 1
        fi
        "$RUNNER_TEMP/source-ci-profile" run-evidence "${context[@]}" \
          --expected-toolchain-sha256 "$frozen_toolchain" \
          --preparation-file "$SOURCE_EVIDENCE/preparation/preparation.json" \
          --evidence-dir "$SOURCE_EVIDENCE/execution"
