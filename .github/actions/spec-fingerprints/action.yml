name: Spec fingerprint files are committed
description: >-
  Fail early when a PR omits or stales the regenerated specs manifest and
  fingerprinted projections (#1134). Pure checkout verification; needs no
  build, toolchain, or credentials.
runs:
  using: composite
  steps:
    - name: Verify regenerated spec fingerprints match the committed manifest
      shell: bash
      run: python3 "${{ github.action_path }}/check_spec_fingerprints.py" "${{ github.workspace }}"
