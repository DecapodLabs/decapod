name: Render Decapod showcase

on:
  push:
    branches:
      - demo/showcase-7s
    paths:
      - assets/showcase/render.py
      - assets/showcase/mascot.svg
      - assets/showcase/README.md
      - .github/workflows/showcase-render.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependencies
        run: |
          python3 -m pip install 'Pillow==11.3.0' 'numpy==2.3.4' 'CairoSVG==2.7.1'
          sudo apt-get update -q
          sudo apt-get install -y fonts-lato libcairo2
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          command -v ffmpeg
          command -v ffprobe
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Render MP4, GIF and poster
        run: python3 assets/showcase/render.py

      - name: Verify duration and artifact presence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          from PIL import Image
          folder = pathlib.Path("assets/showcase/generated")
          mp4 = folder / "decapod-showcase.mp4"
          gif = folder / "decapod-showcase.gif"
          poster = folder / "decapod-showcase-poster.png"
          mascot = pathlib.Path("assets/showcase/mascot.png")
          avatar = pathlib.Path("assets/showcase/mascot-github-avatar.png")
          info = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "json", str(mp4)
          ], text=True))
          duration = float(info["format"]["duration"])
          assert 6.0 <= duration < 7.0, f"video duration={duration}"
          streams = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "stream=codec_type,codec_name",
              "-of", "json", str(mp4)
          ], text=True))["streams"]
          stream_types = {s["codec_type"] for s in streams}
          assert stream_types == {"audio", "video"}, stream_types
          assert any(s["codec_name"] == "aac" for s in streams), streams
          assert any(s["codec_name"] == "h264" for s in streams), streams
          for path in (mp4, gif, poster, mascot, avatar):
              assert path.is_file() and path.stat().st_size > 1000, str(path)
          with Image.open(mascot) as im:
              assert im.mode == 'RGBA' and im.size == (1040, 880)
              assert im.getchannel('A').getextrema() == (0, 255)
          with Image.open(avatar) as im:
              assert im.mode == 'RGBA' and im.size == (1024, 1024)
              mask = im.getchannel('A')
              assert mask.getextrema() == (0, 255)
              bbox = mask.getbbox()
              assert bbox is not None
              # A conservative bounding-box test leaves safe room in the
              # GitHub circular avatar crop, even at its corners.
              assert all((x - 512)**2 + (y - 512)**2 < 490**2
                         for x in (bbox[0], bbox[2])
                         for y in (bbox[1], bbox[3])), bbox
          with Image.open(gif) as im:
              assert im.n_frames >= 80, im.n_frames
          print(f"Verified: {duration:.4f}s, H264/AAC, {mp4.stat().st_size:,} MP4 bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: decapod-showcase
          path: |
            assets/showcase/generated/
            assets/showcase/mascot.png
            assets/showcase/mascot-github-avatar.png
          if-no-files-found: error

      - name: Commit rendered media to the showcase branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo/showcase-7s'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/showcase/generated/ assets/showcase/mascot.png assets/showcase/mascot-github-avatar.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(showcase): publish verified 6.900-second film and avatar PNG"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
