name: Docs Auto-Sync

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  autosync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1

      - name: Build Decapod
        run: cargo build --locked --bin decapod

      - name: Configure git identity
        run: |
          git config user.name "decapod-docs-autosync[bot]"
          git config user.email "docs-autosync@decapod.invalid"

      - name: Run governed docs auto-sync lifecycle
        id: sync
        env:
          DECAPOD_BIN: ./target/debug/decapod
          DOCS_AUTOSYNC_BASE_REF: origin/master
          DOCS_AUTOSYNC_TARGET_BASE: master
          DOCS_AUTOSYNC_BRANCH: docs-autosync
          DOCS_AUTOSYNC_REPORT_PATH: ${{ runner.temp }}/docs-autosync-drift-report.md
        run: bash assets/tools/docs_autosync_governed.sh

      - name: Upload drift report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-autosync-drift-report-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-autosync-drift-report.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Create or update governed Pull Request
        if: steps.sync.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head docs-autosync --base master --state open --json number --jq '.[0].number // empty')"
          body=$(cat <<EOF
          This is an automated governed PR to synchronize documentation with the current code state on \`master\` (\`${{ steps.sync.outputs.base_sha }}\`).

          - Governed head: \`${{ steps.sync.outputs.head_sha }}\`
          - Checkpoint: \`${{ steps.sync.outputs.checkpoint_id }}\`
          - Verified locally via \`decapod govern artifacts verify-checkpoints --publication-material\` before push.
          - Generated by Decapod Docs Auto-Sync workflow (#1388).
          EOF
          )
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create \
              --base master \
              --head docs-autosync \
              --title "docs: auto-sync documentation from code state" \
              --body "$body"
          fi
