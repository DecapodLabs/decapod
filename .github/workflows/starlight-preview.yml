name: Starlight Documentation Preview

on:
  push:
    branches: ['docs/starlight-cutover-20261116']
  pull_request:
    branches: [master]
    paths:
      - 'docs/starlight/**'
      - 'docs/book/src/**'
      - '.github/workflows/starlight-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-starlight:
    name: Verify public documentation presentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned documentation dependencies
        working-directory: docs/starlight
        run: npm install --no-audit --no-fund
      - name: Build and verify all pages, legacy routes, search and branding
        working-directory: docs/starlight
        run: npm run build
      - name: Upload validated site preview
        uses: actions/upload-artifact@v4
        with:
          name: starlight-preview
          path: docs/starlight/dist
          if-no-files-found: error
