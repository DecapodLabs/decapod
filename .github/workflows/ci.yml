name: CI

on:
  # Keep the complete PR check suite attached to every pull-request update.
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Cancel in-progress runs for massive time savings
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  # Prove a version-only release from immutable Git objects, never labels/titles.
  release-metadata:
    name: Release Metadata Classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_only: ${{ steps.classify.outputs.release_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Classify immutable change range
        id: classify
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rustc --edition=2024 assets/tools/release_metadata.rs -o "$RUNNER_TEMP/decapod-release-metadata"
          "$RUNNER_TEMP/decapod-release-metadata" \
            --repo . --event "$CHANGE_EVENT" --base "$CHANGE_BASE" --head "$CHANGE_HEAD" \
            | tee -a "$GITHUB_OUTPUT"

  # COMMIT LINT: Fast check, no build dependency
  commit-lint:
    name: Commit Lint
    needs: release-metadata
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.release-metadata.outputs.release_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          git log --format=%B origin/${{ github.base_ref }}..HEAD | while read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qiE "^(wip|fixup|squash)"; then
              echo "❌ ERROR: WIP commit found: $msg"
              exit 1
            fi
          done
          echo "✅ Commit messages look good"

  # Verify the immutable PR commit range, including intermediate authored work.
  governance-artifacts:
    name: Governance Checkpoints (every authored commit)
    runs-on: ubuntu-latest
    needs: [release-metadata, setup]
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.release-metadata.outputs.release_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download shared decapod binary
        uses: actions/download-artifact@v4
        with:
          name: decapod-debug-linux-${{ github.sha }}
          path: target/debug
      - name: Verify normalized governance and every authored checkpoint
        env:
          GOVERNANCE_BASE_BRANCH: ${{ github.base_ref || 'master' }}
          GOVERNANCE_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          chmod +x target/debug/decapod
          git fetch --no-tags --prune origin "$GOVERNANCE_BASE_BRANCH"
          ./target/debug/decapod govern artifacts verify-checkpoints \
            --base-branch "origin/$GOVERNANCE_BASE_BRANCH" \
            --head-ref "$GOVERNANCE_HEAD_REF"

  # MATERIAL LIVING SPECS: Each PR must rewrite authored living-spec prose,
  # not only refresh fingerprints/attestation blocks (GitHub #1183).
  material-specs:
    name: Material Living Specs (beyond fingerprints)
    needs: release-metadata
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.release-metadata.outputs.release_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require material specs/*.md change versus base
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref || 'master' }}"
          git fetch --no-tags --prune origin "$base_ref"
          python3 - <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          base_ref = """${{ github.base_ref || 'master' }}"""
          specs_dir = Path(".decapod/managed/specs")
          names = [
              "INTENT.md",
              "ARCHITECTURE.md",
              "INTERFACES.md",
              "VALIDATION.md",
              "SEMANTICS.md",
              "OPERATIONS.md",
              "SECURITY.md",
              "README.md",
          ]
          patterns = [
              re.compile(
                  r"<!-- decapod:codebase-attestation:start -->.*?<!-- decapod:codebase-attestation:end -->",
                  re.S,
              ),
              re.compile(
                  r"<!-- decapod:declared-capabilities:start -->.*?<!-- decapod:declared-capabilities:end -->",
                  re.S,
              ),
              re.compile(
                  r"<!-- decapod:capability-overlay:[^:]+:start -->.*?<!-- decapod:capability-overlay:[^:]+:end -->",
                  re.S,
              ),
          ]

          def material(text: str) -> str:
              for pat in patterns:
                  text = pat.sub("", text)
              return text

          def git_show(path: str) -> str:
              proc = subprocess.run(
                  ["git", "show", f"origin/{base_ref}:{path}"],
                  capture_output=True,
                  text=True,
              )
              return proc.stdout if proc.returncode == 0 else ""

          material_hits = []
          for name in names:
              head_path = specs_dir / name
              if not head_path.is_file():
                  continue
              rel = f"{specs_dir.as_posix()}/{name}"
              base_mat = material(git_show(rel))
              head_mat = material(head_path.read_text(encoding="utf-8"))
              if base_mat != head_mat:
                  print(f"✅ material change: {rel}")
                  material_hits.append(rel)

          if not material_hits:
              print(
                  f"❌ FINGERPRINT_ONLY_SPECS: no material authored-content change under "
                  f"{specs_dir}/*.md versus origin/{base_ref}."
              )
              print(
                  "Fingerprint/attestation refresh alone is insufficient. "
                  "Update at least one living spec with prose for this PR."
              )
              sys.exit(1)

          print(
              f"✅ At least one living spec has a material rewrite versus origin/{base_ref}"
          )
          PY

  # PROPODUS LIVE PROOF: Manual, protected, and explicitly opt-in only.
  propodus-live:
    name: Propodus Live Contract Proof
    runs-on: ubuntu-latest
    environment: propodus-live
    if: github.event_name == 'workflow_dispatch' && vars.DECAPOD_PROPODUS_LIVE == 'true'
    env:
      DECAPOD_PROPODUS_LIVE: "1"
      DECAPOD_PROPODUS_API_URL: ${{ secrets.DECAPOD_PROPODUS_API_URL }}
      DECAPOD_PROPODUS_ACCESS_TOKEN: ${{ secrets.DECAPOD_PROPODUS_ACCESS_TOKEN }}
      DECAPOD_PROPODUS_DISPOSABLE_REPO_ID: ${{ secrets.DECAPOD_PROPODUS_DISPOSABLE_REPO_ID }}
      DECAPOD_PROPODUS_DOGFOOD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Verify protected live-proof inputs
        run: |
          set -euo pipefail
          for variable in DECAPOD_PROPODUS_API_URL DECAPOD_PROPODUS_ACCESS_TOKEN DECAPOD_PROPODUS_DISPOSABLE_REPO_ID DECAPOD_PROPODUS_DOGFOOD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing protected live-proof input: $variable"
              exit 1
            fi
          done
      - name: Run opt-in live proof
        run: cargo test --locked --test propodus_live -- --ignored --nocapture

  detect-migration-script-changes:
    name: Detect Migration Script Changes
    needs: release-metadata
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.release-metadata.outputs.release_only != 'true'
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed migration scripts
        id: diff
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref || 'master' }}"
          git fetch --no-tags --prune origin "$base_ref"
          changed_files="$(git diff --name-only "origin/$base_ref"...HEAD)"
          echo "$changed_files"
          if echo "$changed_files" | grep -qE '^src/decapod/core/sql/.*\.sql$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  supabase-consumer:
    name: Supabase consumer (offline fixtures)
    needs: release-metadata
    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-supabase-consumer-v1.96.1"
      - name: Supabase HTTP and existing cloud boundaries
        run: >-
          cargo test --locked --features supabase-cloud --lib
          --test cloud_supabase_boundary --test cloud_dactyl_boundary
          --test release_dependency_policy
          --test cloud_cli_boundary --test cloud_command_path --test cloud_todo_resume_wire --test propodus_contract
          --test supabase_service
      # Real service profiles stay ignored. They require an externally owned
      # disposable PostgreSQL fixture or protected hosted Supabase inputs.

  workspace-lifecycle-docker:
    name: Workspace lifecycle (actual Docker)
    needs: release-metadata
    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-supabase-consumer-v1.96.1"
      - name: Prepare explicit disposable runtime fixture
        run: docker pull busybox:1.37
      - name: Prove interrupted caller and owned container recovery
        env:
          DECAPOD_RUN_DOCKER_LIFECYCLE_TEST: "1"
          DECAPOD_TEST_DOCKER_IMAGE: busybox:1.37
        run: >-
          cargo test --locked --lib
          core::workspace_lifecycle::tests::docker_parent_interrupt_recovers_owned_container
          -- --ignored --exact --nocapture

  musl-publication:
    name: Musl build and atomic publication (${{ matrix.target }})
    needs: release-metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}
      - name: Install native musl compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-musl-${{ matrix.target }}-v1.96.1
      - name: Compile the release CLI for musl
        run: cargo build --locked --release --target ${{ matrix.target }} --bin decapod
      - name: Run musl no-replace publication regressions
        if: needs.release-metadata.outputs.release_only != 'true'
        run: >-
          cargo test --locked --release --target ${{ matrix.target }} --lib
          no_replace_publication -- --nocapture

  # FMT: Pure source check, no compile needed
  fmt:
    name: Lint (fmt)
    needs: release-metadata
    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  # CLIPPY: Compiles its own analysis pass, runs in parallel with setup
  clippy:
    name: Lint (clippy)
    needs: release-metadata
    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy
      - name: Restore cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build-v1.96.1"
          save-if: "false"
      - name: Clippy
        run: CLIPPY_CONF_DIR=.config cargo clippy --all-targets --all-features -- -D warnings

  # DEPS-LINT: Cargo deny and unused dependency checks
  deps-lint:
    name: Lint (dependencies)
    needs: release-metadata
    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Install cargo-machete
        run: |
          set -euo pipefail
          if ! command -v cargo-machete >/dev/null 2>&1; then
            cargo install --locked cargo-machete
          fi
      - name: Run cargo-machete check
        run: cargo machete
      - name: Check license and duplicate dependencies
        run: |
          set -euo pipefail
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install --locked cargo-deny
          fi
          cargo deny --config .config/deny.toml check

  # VALIDATE: fan-out from the shared decapod binary built by setup
  health:
    name: Decapod Validate
    runs-on: ubuntu-latest
    needs: [setup, release-metadata]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download shared decapod binary
        uses: actions/download-artifact@v4
        with:
          name: decapod-debug-linux-${{ github.sha }}
          path: target/debug
      - name: Install shared decapod binary
        run: |
          chmod +x target/debug/decapod target/debug/decapod-release-projection-drift
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Start validation trajectory
        env:
          # CI checkouts are detached and are not Decapod agent worktrees.
          # Keep the normal validation gates enabled, but allow this ephemeral
          # proof bootstrap to write its run cookie in the checkout.
          DECAPOD_VALIDATE_SKIP_GIT_GATES: "1"
        run: |
          set -euo pipefail
          run_id="ci-health-${GITHUB_RUN_ID:-${BUILDKITE_BUILD_ID:-local}}"
          decapod govern trajectory init \
            --run-id "$run_id" \
            --original-intent "Validate the checked-out Decapod repository" \
            --derived-intent "Run the bounded repository validation gates and bind the receipt to this CI run" \
            --boundary "Repository validation and tracked proof artifacts" \
            --scope ".decapod/governance.json" \
            --destination "CI health validation" \
            --phase validation \
            --next-transition publish
      - name: Initialize Decapod
        # Do not re-init an existing tree: init can invent non-idempotent churn
        # that the drift gate below would treat as a packaging failure.
        run: |
          if [ ! -d .decapod ]; then
            decapod init --proof
          fi
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: "1"
      - name: Acquire Decapod session
        run: decapod session acquire
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: "1"
          DECAPOD_CLOUD_AUTH_MODE: mock
      - name: Run validation harness
        run: decapod validate --refresh-specs
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: "1"
          DECAPOD_VALIDATE_TIMEOUT_SECS: "120"
      - name: Ensure no spec or entrypoint drift
        # validate rewrites generated metadata every run; that is not semantic
        # drift. Normalize it to HEAD before the exit-code check.
        # Version-only releases may refresh only proven release projections.
        # Validation above remains mandatory, including its authoritative proofs.
        env:
          RELEASE_ONLY: ${{ needs.release-metadata.outputs.release_only }}
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_ONLY" = "true" ]; then
            decapod-release-projection-drift \
              --repo . --event "$CHANGE_EVENT" --base "$CHANGE_BASE" --head "$CHANGE_HEAD"
            exit 0
          fi
          MANIFEST=".decapod/managed/specs/.manifest.json"
          if git cat-file -e "HEAD:${MANIFEST}" 2>/dev/null && [ -f "${MANIFEST}" ]; then
            OLD=$(git show "HEAD:${MANIFEST}" | sed -n 's/.*"generated_at": "\([^"]*\)".*/\1/p' | head -1)
            if [ -n "${OLD}" ]; then
              sed -i "s/\"generated_at\": \"[^\"]*\"/\"generated_at\": \"${OLD}\"/" "${MANIFEST}"
            fi
            OLD_SIGNAL=$(git show "HEAD:${MANIFEST}" | sed -n 's/.*"repo_signal_fingerprint": "\([^"]*\)".*/\1/p' | head -1)
            if [ -n "${OLD_SIGNAL}" ]; then
              sed -i "s/\"repo_signal_fingerprint\": \"[^\"]*\"/\"repo_signal_fingerprint\": \"${OLD_SIGNAL}\"/" "${MANIFEST}"
            fi
          fi
          if ! git diff --exit-code -- . ':!.decapod/governance.json'; then
            echo "::error::Release-bound or living-spec drift detected after validate --refresh-specs."
            echo "Commit regenerated entrypoints (AGENTS/CLAUDE/CODEX/GEMINI), managed Dockerfile, and .decapod/managed/specs/*."
            echo "Refresh and commit release-bound projections before opening the code PR."
            exit 1
          fi
      - name: Run watcher
        run: decapod govern watcher run
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: "1"
      - name: Check health summary
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: "1"
        run: |
          STATUS=$(decapod govern health summary)
          echo "$STATUS"
          if echo "$STATUS" | grep -q '"watcher_stale": true'; then
            echo "::warning::Watcher is stale"
          fi

  # STATE_COMMIT: Builds its own golden_vectors binary, no dependency on setup
  state-commit-golden-vectors:
    name: Golden Vectors (${{ matrix.os }})
    needs: release-metadata
    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ${{ matrix.os }}
    env:
      DECAPOD_STATE_COMMIT_CI_JOB: state-commit-golden-vectors
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Verify golden vectors exist
        run: |
          echo "=== Verifying golden vectors exist ==="
          test -f tests/golden/state_commit/v1/scope_record.cbor || exit 1
          test -f tests/golden/state_commit/v1/scope_record_hash.txt || exit 1
          test -f tests/golden/state_commit/v1/state_commit_root.txt || exit 1
          echo "=== Expected values ==="
          echo "scope_record_hash: 41d7e3729b6f4512887fb3cb6f10140942b600041e0d88308b0177e06ebb4b93"
          echo "state_commit_root: 28591ac86e52ffac76d5fc3aceeceda5d8592708a8d7fcb75371567fdc481492"
          echo "=== Actual committed values ==="
          cat tests/golden/state_commit/v1/scope_record_hash.txt
          cat tests/golden/state_commit/v1/state_commit_root.txt
      - name: Build golden vectors generator
        run: cd tests/golden_vectors && unset RUSTFLAGS && cargo build --release
      - name: Initialize fixture repo
        run: |
          cd tests/fixtures/state_commit_repo
          git init
          git config user.email "test@test.com"
          git config user.name "Test"
          git add initial.txt
          git commit -m "base commit"
          git add .
          git commit -m "fixture commit"
      - name: Run golden vectors generator
        working-directory: tests/golden_vectors
        run: |
          ./target/release/golden_vectors > /tmp/generated.txt 2>&1
          GEN_HASH=$(grep "scope_record_hash:" /tmp/generated.txt | awk '{print $2}')
          GEN_ROOT=$(grep "state_commit_root:" /tmp/generated.txt | awk '{print $2}')
          echo "Generated hash: $GEN_HASH"
          echo "Generated root: $GEN_ROOT"
          test -n "$GEN_HASH" || exit 1
          test -n "$GEN_ROOT" || exit 1
          echo "✅ Golden vectors generator runs successfully"
      - name: Verify no network dependencies
        run: |
          if grep -qE "(reqwest|hyper|ureq|http)" tests/golden_vectors/Cargo.toml; then
            echo "ERROR: golden_vectors has network dependencies"
            exit 1
          fi
          echo "✅ No network dependencies"

  # SETUP: Compile the shared decapod binary once and save both cache + binary artifact.
  setup:
    name: Setup & Build Shared Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Buildkite's GHA runtime does not provide the setup-bazel action's
      # cache/setup contract. Install the pinned launcher in the workflow so
      # native GitHub Actions and Buildkite execute the same command.
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Compile shared decapod binary
        run: bazelisk build //:decapod //:release_projection_drift
      - name: Stage shared decapod binary
        run: |
          set -euo pipefail
          mkdir -p target/buildkite-artifacts
          cp -L bazel-bin/decapod target/buildkite-artifacts/decapod
          cp -L bazel-bin/release_projection_drift target/buildkite-artifacts/decapod-release-projection-drift
          test -x target/buildkite-artifacts/decapod
      - name: Upload shared decapod binary
        uses: actions/upload-artifact@v4
        with:
          name: decapod-debug-linux-${{ github.sha }}
          # Upload a regular workspace file: Bazel's bazel-bin path is a
          # symlink, and Buildkite's artifact adapter rejects symlink roots.
          path: |
            target/buildkite-artifacts/decapod
            target/buildkite-artifacts/decapod-release-projection-drift
          retention-days: 1
          compression-level: 0

# SELECTIVE TESTS: Run only tests for changed files (PRs) or all tests (master)
  test:
    name: Tests (${{ matrix.target }})
    needs: release-metadata
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.release-metadata.outputs.release_only != 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [core, plugins, cli]
    steps:
      - uses: actions/checkout@v4
        with:
          # Selective tests need the PR base commit. Buildkite's migrated
          # checkout honors the full-history mode, while GitHub Actions keeps
          # the same diff semantics with a complete local history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Detect changed files
        id: changed
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref || 'master' }}"
          if [ -n "${BUILDKITE_PULL_REQUEST_BASE_BRANCH:-}" ]; then
            base_ref="$BUILDKITE_PULL_REQUEST_BASE_BRANCH"
          fi
          if ! git fetch --no-tags --prune origin "$base_ref"; then
            echo "::warning::PR base fetch unavailable; using refs already present in the full checkout."
          fi
          if base_commit=$(git rev-parse --verify "origin/$base_ref^{commit}" 2>/dev/null); then
            chg=$(git diff --name-only "$base_commit"...HEAD | tr '\n' ',' | sed 's/,$//')
          elif base_commit=$(git rev-parse --verify HEAD^ 2>/dev/null); then
            echo "::warning::PR base ref unavailable; using the checked-out commit parent for selective test detection."
            chg=$(git diff --name-only "$base_commit"...HEAD | tr '\n' ',' | sed 's/,$//')
          else
            echo "::error::No PR base or commit parent is available for selective test detection."
            exit 1
          fi
          echo "changed=$chg" >> "$GITHUB_OUTPUT"
      - name: Run selective tests
        run: |
          set -euo pipefail
          CHANGED="${{ steps.changed.outputs.changed }}"
          echo "Changed files: $CHANGED"

          case "${{ matrix.target }}" in
            core)
              if echo "$CHANGED" | grep -qE 'src/decapod/core/(todo|validate|workspace|workunit|obligation|docs|capsule|rpc|migration|gateway)'; then
                # Time the real broker follow-up independently before the full
                # suite so its bounded stage diagnostics survive a suite timeout.
                time bazelisk test //:group_broker \
                  --test_arg=committed_claim_preparation_does_not_hold_broker_or_repeat_on_retry \
                  --test_arg=--exact --test_arg=--nocapture \
                  --test_output=all
                time bazelisk test //:group_broker \
                  --test_arg=broker_no_sqlite_busy_surfaced_under_concurrent_mutators \
                  --test_arg=--exact --test_arg=--nocapture \
                  --test_output=all
                bazelisk test \
                  //:todo_enforcement \
                  //:validate_termination \
                  //:workspace_interlock \
                  //:spec_workspace_ownership \
                  //:workspace_prune_regression \
                  //:hermes_governance_substrate \
                  //:group_broker \
                  //:group_broker_strict \
                  //:workunit_cli \
                  //:context_capsule_cli \
                  --test_arg=--test-threads=1
              elif echo "$CHANGED" | grep -qE 'src/decapod/core/'; then
                bazelisk test //:entrypoint_correctness --test_arg=--test-threads=1
              fi
              ;;
            plugins)
              if echo "$CHANGED" | grep -qE 'src/decapod/plugins/'; then
                # Todo tests exercise a process-global storage pool and
                # already spawn their own contention workers. Keep the
                # outer Rust test scheduler serial so unrelated fixtures
                # cannot starve bounded lock assertions.
                bazelisk test \
                  //:plugins_todo_tests \
                  //:plugins_policy_tests \
                  //:plugins_health_tests \
                  //:plugins_aptitude_tests \
                  //:plugins_internalize_tests \
                  //:plugins_federation_tests \
                  //:plugins_decide_tests \
                  //:plugins_obligation_tests \
                  --test_arg=--test-threads=1
              fi
              ;;
            cli)
              if echo "$CHANGED" | grep -qE 'src/(decapod/(cli|lib)|main)'; then
                bazelisk test \
                  //:cli_contract_enforcement \
                  //:entrypoint_correctness \
                  //:cli_contracts \
                  --test_arg=--test-threads=1
              fi
              ;;
          esac
          echo "✓ Selective tests passed"

  # Build selected integration tests once, then distribute relocatable runfiles.
  # Compilation is shared work, never repeated inside each timed test shard.
  integration-prepare:
    name: Prepare Integration Tests
    needs: release-metadata
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.release-metadata.outputs.release_only != 'true'
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Plan integration shards from changed files
        id: plan
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref || 'master' }}"
          if ! git fetch --no-tags --prune origin "$base_ref"; then
            echo "::warning::PR base fetch unavailable; using refs already present in the full checkout."
          fi
          if base_commit=$(git rev-parse --verify "origin/$base_ref^{commit}" 2>/dev/null); then
            git diff --name-only -z "$base_commit"...HEAD > "$RUNNER_TEMP/integration-paths.txt"
          elif base_commit=$(git rev-parse --verify HEAD^ 2>/dev/null); then
            echo "::warning::PR base ref unavailable; using the checked-out commit parent for selective test detection."
            git diff --name-only -z "$base_commit"...HEAD > "$RUNNER_TEMP/integration-paths.txt"
          else
            echo "::error::No PR base or commit parent is available for selective test detection."
            exit 1
          fi
          rustc --edition=2024 assets/tools/integration_shards.rs -o "$RUNNER_TEMP/integration-shards"
          "$RUNNER_TEMP/integration-shards" plan --paths "$RUNNER_TEMP/integration-paths.txt" > "$RUNNER_TEMP/integration-matrix.json"
          echo "matrix=$(jq -c . "$RUNNER_TEMP/integration-matrix.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' "$RUNNER_TEMP/integration-matrix.json")" >> "$GITHUB_OUTPUT"
      - name: Compile and package selected integration tests once
        if: steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/integration-shards" prepare \
            --paths "$RUNNER_TEMP/integration-paths.txt" \
            --output "$RUNNER_TEMP/integration-tests"
          mkdir -p target/integration-artifacts
          tar -C "$RUNNER_TEMP/integration-tests" -cf target/integration-artifacts/integration-tests.tar .
      - name: Upload shared integration tests
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: decapod-integration-linux-${{ github.sha }}
          # A regular archive preserves executable modes and runfile hard links.
          path: target/integration-artifacts/integration-tests.tar
          retention-days: 1
          compression-level: 0

  test-integration:
    name: Tests (integration ${{ matrix.shard }})
    needs: [release-metadata, integration-prepare]
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.release-metadata.outputs.release_only != 'true' && needs.integration-prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.integration-prepare.outputs.matrix) }}
    steps:
      - name: Download shared integration tests
        uses: actions/download-artifact@v4
        with:
          name: decapod-integration-linux-${{ github.sha }}
          path: target/integration-download
      - name: Restore integration executables and runfiles
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integration-tests"
          tar -xf target/integration-download/integration-tests.tar -C "$RUNNER_TEMP/integration-tests"
      - name: Run selective tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/integration-tests/integration-shards" run \
            --artifact "$RUNNER_TEMP/integration-tests" \
            --shard "${{ matrix.shard }}"

  # Preserve the established required-check name while aggregating every shard.
  integration-status:
    name: Tests (integration)
    needs: [release-metadata, integration-prepare, test-integration]
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.release-metadata.result == 'success' && needs.release-metadata.outputs.release_only != 'true'
    steps:
      - name: Require successful preparation and complete shard coverage
        env:
          PREPARE_RESULT: ${{ needs.integration-prepare.result }}
          SHARD_RESULT: ${{ needs.test-integration.result }}
          SHARD_COUNT: ${{ needs.integration-prepare.outputs.count }}
        run: |
          set -euo pipefail
          test "$PREPARE_RESULT" = success
          if [ "$SHARD_COUNT" = 0 ]; then
            test "$SHARD_RESULT" = skipped
          elif [[ "$SHARD_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            test "$SHARD_RESULT" = success
          else
            echo "::error::Missing or invalid integration shard count."
            exit 1
          fi

  # MASTER: Full test suite for direct master pushes only
  test-master:
    name: Tests (Full)
    needs: release-metadata
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') && needs.release-metadata.outputs.release_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Run all tests
        run: bazelisk test //:gatling --test_arg=--test-threads=4

  # RPC SUITE: isolated to avoid contention
  test-rpc-suite:
    name: Tests (RPC Suite)
    needs: release-metadata
    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Run RPC suite
        run: bazelisk test //:agent_rpc_suite --test_arg=--test-threads=1

  # CHAOS: Multi-agent contention + deterministic replay gate
  chaos-replay:
    name: Chaos Replay Gate
    needs: release-metadata
    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Run chaos replay determinism test
        run: bazelisk test //:chaos_replay --test_arg=--test-threads=1

  # DAEMONLESS: ensure commands do not leave background processes
  daemonless-lifecycle:
    name: Daemonless Lifecycle Gate
    needs: release-metadata
    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Run daemonless lifecycle test
        run: bazelisk test //:daemonless_lifecycle --test_arg=--test-threads=1

  # CONTRACTS: README/Constitution drift detection
  contracts:
    name: Contract Conformance
    needs: release-metadata
    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Run contract conformance tests
        run: |
          bazelisk test //:contract_conformance --test_arg=--test-threads=1
          bazelisk test //:constitution_claims --test_arg=--test-threads=1
      - name: Run CLI contract enforcement tests
        run: bazelisk test //:cli_contract_enforcement --test_arg=--test-threads=1

  # MIGRATION TESTS: Only when SQL migration scripts change
  migration-script-tests:
    name: Migration Script Tests
    runs-on: ubuntu-latest
    needs: [release-metadata, detect-migration-script-changes]
    if: ((github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.detect-migration-script-changes.outputs.changed == 'true') && needs.release-metadata.outputs.release_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Run migration tests
        run: bazelisk test //:core_tests --test_arg=migration_ --test_arg=--ignored --test_arg=--test-threads=1

  # RELEASE BUILD: Only on master, after all checks pass
  release-build:
    name: Release Build Check
    runs-on: ubuntu-latest
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/master' &&
      needs.release-metadata.result == 'success' && needs.health.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [release-metadata, fmt, clippy, deps-lint, test, integration-prepare, test-integration, integration-status, test-master, test-rpc-suite, chaos-replay, daemonless-lifecycle, workspace-lifecycle-docker, contracts, health, musl-publication]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Build release
        run: bazelisk build -c opt //:decapod
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: decapod-${{ github.sha }}
          path: bazel-bin/decapod
          retention-days: 1
          compression-level: 9
