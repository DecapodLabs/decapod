      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify immutable CI context
        id: ci-context
        uses: ./.github/actions/ci-context
        with:
          pre-pr: ${{ inputs.pre-pr && 'true' || 'false' }}
          base: ${{ inputs.base || '' }}
          head: ${{ inputs.head || '' }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Prepare shared source-CI profile
        uses: ./.github/actions/source-ci-profile

      - name: Run platform golden vectors checks
        run: "set -euo pipefail\nif [ \"${{ matrix.os }}\" = macos-latest ]; then\n  \"$RUNNER_TEMP/source-ci-profile\" run-ci --check golden-vectors-macos\nelse\n  \"$RUNNER_TEMP/source-ci-profile\" run-ci --check golden-vectors-linux\nfi\n"
