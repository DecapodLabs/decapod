  setup:
    name: Setup & Build Shared Binary
    needs: release-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable CI context
        id: ci-context
        uses: ./.github/actions/ci-context
        with:
          pre-pr: ${{ inputs.pre-pr && 'true' || 'false' }}
          base: ${{ inputs.base || '' }}
          head: ${{ inputs.head || '' }}
      # Buildkite's GHA runtime does not provide the setup-bazel action's
      # cache/setup contract. Install the pinned launcher in the workflow so
      # native GitHub Actions and Buildkite execute the same command.
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Prepare shared source-CI profile
        uses: ./.github/actions/source-ci-profile

      - name: Compile shared decapod binary
        run: '"$RUNNER_TEMP/source-ci-profile" run-ci --check setup-bazel'
      - name: Stage shared decapod binary
        run: |
          set -euo pipefail
          mkdir -p target/buildkite-artifacts
          cp -L bazel-bin/decapod target/buildkite-artifacts/decapod
          cp -L bazel-bin/release_projection_drift target/buildkite-artifacts/decapod-release-projection-drift
          test -x target/buildkite-artifacts/decapod
      - name: Upload shared decapod binary
        uses: actions/upload-artifact@v4
        with:
          name: decapod-debug-linux-${{ github.sha }}
          # Upload a regular workspace file: Bazel's bazel-bin path is a
          # symlink, and Buildkite's artifact adapter rejects symlink roots.
          path: |
            target/buildkite-artifacts/decapod
            target/buildkite-artifacts/decapod-release-projection-drift
          retention-days: 1
          compression-level: 0

# SELECTIVE TESTS: Run only tests for changed files (PRs) or all tests (master)
      - name: Upload measured source-CI custody
        if: always() && env.SOURCE_CI_CUSTODY_ARTIFACT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_CI_CUSTODY_ARTIFACT }}
          path: ${{ runner.temp }}/source-ci-evidence
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
  test:
    name: Tests (${{ matrix.target }})
    needs: release-metadata
    runs-on: ubuntu-latest
    if: (needs.release-metadata.outputs.pr_like == 'true') && needs.release-metadata.outputs.release_only != 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [core, plugins, cli]
    steps:
      - uses: actions/checkout@v4
        with:
          # Selective tests need the PR base commit. Buildkite's migrated
          # checkout honors the full-history mode, while GitHub Actions keeps
          # the same diff semantics with a complete local history.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable CI context
        id: ci-context
        uses: ./.github/actions/ci-context
        with:
          pre-pr: ${{ inputs.pre-pr && 'true' || 'false' }}
          base: ${{ inputs.base || '' }}
          head: ${{ inputs.head || '' }}
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Prepare shared source-CI profile
        uses: ./.github/actions/source-ci-profile

      - name: Run selective tests
        env:
          CHANGE_BASE: ${{ steps.ci-context.outputs.base }}
          CHANGE_HEAD: ${{ steps.ci-context.outputs.head }}
        run: 'set -euo pipefail

          "$RUNNER_TEMP/source-ci-profile" run-ci --check "selective-${{ matrix.target }}" --base "$CHANGE_BASE" --head "$CHANGE_HEAD"

          '
      - name: Upload measured source-CI custody
        if: always() && env.SOURCE_CI_CUSTODY_ARTIFACT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_CI_CUSTODY_ARTIFACT }}
          path: ${{ runner.temp }}/source-ci-evidence
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
  integration-prepare:
    name: Prepare Integration Tests
    needs: release-metadata
    runs-on: ubuntu-latest
    if: (needs.release-metadata.outputs.pr_like == 'true') && needs.release-metadata.outputs.release_only != 'true'
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      context: ${{ steps.plan.outputs.context }}
      helper_sha256: ${{ steps.plan.outputs.helper_sha256 }}
      archive_sha256: ${{ steps.plan.outputs.archive_sha256 }}
      bootstrap_sha256: ${{ steps.plan.outputs.bootstrap_sha256 }}
      profile_sha256: ${{ steps.plan.outputs.profile_sha256 }}
      worker_script_sha256: ${{ steps.plan.outputs.worker_script_sha256 }}
      status_script_sha256: ${{ steps.plan.outputs.status_script_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable CI context
        id: ci-context
        uses: ./.github/actions/ci-context
        with:
          pre-pr: ${{ inputs.pre-pr && 'true' || 'false' }}
          base: ${{ inputs.base || '' }}
          head: ${{ inputs.head || '' }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
