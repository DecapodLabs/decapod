    if: needs.release-metadata.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable CI context
        id: ci-context
