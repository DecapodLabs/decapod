      - name: Prepare shared source-CI profile
        uses: ./.github/actions/source-ci-profile

      - name: Plan and compile integration tests once
        id: plan
        env:
          CHANGE_BASE: ${{ steps.ci-context.outputs.base }}
          CHANGE_HEAD: ${{ steps.ci-context.outputs.head }}
          CUSTODY_EVENT: ${{ steps.ci-context.outputs.event }}
          CUSTODY_BASE: ${{ steps.ci-context.outputs.base }}
