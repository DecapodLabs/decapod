  release-build:
    name: Release Build Check
    runs-on: ubuntu-latest
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/master' &&
      needs.release-metadata.outputs.pre_pr == 'false' &&
      needs.release-metadata.result == 'success' && needs.health.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [release-metadata, fmt, clippy, deps-lint, test, integration-prepare, test-integration, integration-status, test-master, test-rpc-suite, chaos-replay, daemonless-lifecycle, workspace-lifecycle-docker, contracts, health, musl-publication]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable CI context
        id: ci-context
        uses: ./.github/actions/ci-context
        with:
          pre-pr: ${{ inputs.pre-pr && 'true' || 'false' }}
          base: ${{ inputs.base || '' }}
          head: ${{ inputs.head || '' }}
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Build release
        run: bazelisk build -c opt //:decapod
      - name: Stage regular release binary
        run: |
          set -euo pipefail
          mkdir -p target/buildkite-artifacts
          stage_dir="$(mktemp -d target/buildkite-artifacts/release.XXXXXX)"
          install -m 0755 bazel-bin/decapod "${stage_dir}/decapod"
          test -f "${stage_dir}/decapod" && test ! -L "${stage_dir}/decapod"
          cmp bazel-bin/decapod "${stage_dir}/decapod"
          echo "RELEASE_BINARY=${stage_dir}/decapod" >> "$GITHUB_ENV"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: decapod-${{ github.sha }}
          path: ${{ env.RELEASE_BINARY }}
          retention-days: 1
          compression-level: 9
