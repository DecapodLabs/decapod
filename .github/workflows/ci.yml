          base: ${{ inputs.base || '' }}
          head: ${{ inputs.head || '' }}
      - name: Install Bazelisk
        run: |
          set -euo pipefail
          bazelisk_dir="${HOME}/.local/bin"
          mkdir -p "$bazelisk_dir"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
              --output "$bazelisk_dir/bazelisk"
            chmod +x "$bazelisk_dir/bazelisk"
          fi
          echo "$bazelisk_dir" >> "$GITHUB_PATH"
          echo "PATH=$bazelisk_dir:$PATH" >> "$GITHUB_ENV"
      - name: Prepare shared source-CI profile
        uses: ./.github/actions/source-ci-profile

      - name: Run chaos replay determinism test
        run: '"$RUNNER_TEMP/source-ci-profile" run-ci --check chaos-replay'
      - name: Upload measured source-CI custody
        if: always() && env.SOURCE_CI_CUSTODY_ARTIFACT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_CI_CUSTODY_ARTIFACT }}
          path: ${{ runner.temp }}/source-ci-evidence
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
