      - name: Upload measured integration custody verifier
        uses: actions/upload-artifact@v4
        with:
          name: decapod-integration-custody-${{ github.sha }}
          path: target/integration-custody-artifacts/integration-custody
          retention-days: 1
          compression-level: 0
      - name: Upload shared integration tests
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: decapod-integration-linux-${{ github.sha }}
          # A regular archive preserves executable modes and runfile hard links.
          path: target/integration-artifacts/integration-tests.tar
          retention-days: 1
          compression-level: 0

      - name: Upload measured source-CI custody
        if: always() && env.SOURCE_CI_CUSTODY_ARTIFACT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_CI_CUSTODY_ARTIFACT }}
          path: ${{ runner.temp }}/source-ci-evidence
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
  test-integration:
    name: Tests (integration ${{ matrix.shard }})
    needs: [release-metadata, integration-prepare]
    runs-on: ubuntu-latest
    if: (needs.release-metadata.outputs.pr_like == 'true') && needs.release-metadata.outputs.release_only != 'true' && needs.integration-prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      # Static scheduling preserves workflow concurrency on both CI providers.
      # Selection remains dynamic; inactive workers do not download or run tests.
      # integration_sharding_policy proves this set covers every planner shard.
      matrix:
        shard:
          - gatling-0
          - gatling-1
          - gatling-2
          - gatling-3
          - release-policies
          - contract_conformance
          - constitution_claims
          - spec_conformance
          - substrate_integrity
    steps:
      - name: Download measured integration bootstrap
        if: contains(fromJSON(needs.integration-prepare.outputs.shards), matrix.shard)
        uses: actions/download-artifact@v4
        with:
          name: decapod-integration-bootstrap-${{ github.sha }}
          path: target/integration-bootstrap-download
      - name: Authenticate integration executor and recipes
        if: contains(fromJSON(needs.integration-prepare.outputs.shards), matrix.shard)
        env:
          CUSTODY_BOOTSTRAP_SHA256: ${{ needs.integration-prepare.outputs.bootstrap_sha256 }}
          CUSTODY_PROFILE_SHA256: ${{ needs.integration-prepare.outputs.profile_sha256 }}
        run: |
          set -euo pipefail
          [[ "$CUSTODY_BOOTSTRAP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$CUSTODY_BOOTSTRAP_SHA256" target/integration-bootstrap-download/integration-bootstrap.tar | sha256sum --check --status
          tar -xf target/integration-bootstrap-download/integration-bootstrap.tar
          [[ "$CUSTODY_PROFILE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$CUSTODY_PROFILE_SHA256" integration-bootstrap/source-ci-profile | sha256sum --check --status
          test -x integration-bootstrap/source-ci-profile
      - name: Download shared integration tests
        if: contains(fromJSON(needs.integration-prepare.outputs.shards), matrix.shard)
        uses: actions/download-artifact@v4
        with:
          name: decapod-integration-linux-${{ github.sha }}
          path: target/integration-download
      - name: Run selected integration shard and record measured success
        if: contains(fromJSON(needs.integration-prepare.outputs.shards), matrix.shard)
        timeout-minutes: 6
        env:
          CUSTODY_EVENT: ${{ needs.release-metadata.outputs.event }}
          CUSTODY_BASE: ${{ needs.release-metadata.outputs.base }}
          CUSTODY_HEAD: ${{ needs.release-metadata.outputs.head }}
          CUSTODY_MERGE_BASE: ${{ needs.release-metadata.outputs.merge_base }}
          CUSTODY_VALIDATION_HEAD: ${{ needs.release-metadata.outputs.validation_head }}
          CUSTODY_TREE: ${{ needs.release-metadata.outputs.validation_tree }}
          CUSTODY_SHARDS: ${{ needs.integration-prepare.outputs.shards }}
          CUSTODY_ARCHIVE_SHA256: ${{ needs.integration-prepare.outputs.archive_sha256 }}
          CUSTODY_HELPER_SHA256: ${{ needs.integration-prepare.outputs.helper_sha256 }}
          CUSTODY_SHARD: ${{ matrix.shard }}
          SOURCE_CI_SNAPSHOT: ${{ needs.release-metadata.outputs.transport_head || needs.release-metadata.outputs.checkout_head }}
        run: integration-bootstrap/source-ci-profile run-ci --check integration-${{ matrix.shard }}
      - name: Upload measured integration shard receipt
        if: contains(fromJSON(needs.integration-prepare.outputs.shards), matrix.shard)
        uses: actions/upload-artifact@v4
        with:
          name: decapod-integration-receipt-${{ github.sha }}-${{ matrix.shard }}
