name: Decapod Validate

on:
  push:
    branches: [ main, master ]
  pull_request: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROPODUS_READONLY_PAT }}
          persist-credentials: true
          
      - name: Debug Token Access
        env:
          GH_TOKEN: ${{ secrets.PROPODUS_READONLY_PAT }}
        run: |
          echo "Checking GH CLI access to propodus..."
          gh api repos/DecapodLabs/propodus -q ".full_name" || echo "GH API access failed"
          
          echo "Checking git ls-remote..."
          git ls-remote https://github.com/DecapodLabs/propodus.git || echo "ls-remote failed"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Decapod
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/decapod
          key: ${{ runner.os }}-decapod
      - name: Install Decapod
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          cargo install --path . --all-features --force
      - name: Decapod Validate
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: 1
        run: |
          decapod init --proof
          decapod validate
