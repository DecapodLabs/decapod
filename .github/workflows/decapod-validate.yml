name: Decapod Validate

on:
  push:
    branches: [ main, master ]
  pull_request: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          
      - name: Debug Clone with PAT
        run: |
          echo "Trying classic PAT format..."
          git clone https://${{ secrets.PROPODUS_PAT }}@github.com/DecapodLabs/propodus.git test-classic || echo "Classic failed"
          
          echo "Trying x-access-token format..."
          git clone https://x-access-token:${{ secrets.PROPODUS_PAT }}@github.com/DecapodLabs/propodus.git test-x-access || echo "X-access-token failed"
          
          echo "Trying token:password format..."
          git clone https://token:${{ secrets.PROPODUS_PAT }}@github.com/DecapodLabs/propodus.git test-token-pass || echo "Token:password failed"

      - name: Configure Git for Private Dependencies
        run: |
          git config --global url."https://${{ secrets.PROPODUS_PAT }}@github.com/DecapodLabs/propodus.git".insteadOf "https://github.com/DecapodLabs/propodus.git"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Decapod
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/decapod
          key: ${{ runner.os }}-decapod
      - name: Install Decapod
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          cargo install --path . --all-features --force
      - name: Decapod Validate
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: 1
        run: |
          decapod init --proof
          decapod validate
