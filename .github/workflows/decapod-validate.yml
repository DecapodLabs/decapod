name: Decapod Validate

on:
  push:
    branches: [ main, master, "agent/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source context
        id: context
        uses: ./.github/actions/ci-context
      - name: Prepare shared source-CI profile
        uses: ./.github/actions/source-ci-profile
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Build and check independent private source validation
        run: '"$RUNNER_TEMP/source-ci-profile" run-ci --check standalone-validation'
      # Failure-only diagnostics inspect the job's private, isolated checkout.
      # They never mutate the candidate or convert an unsuccessful gate to green.
      - name: Diagnose generated projection drift
        if: failure()
        run: |
          set -euo pipefail
          shopt -s nullglob
          for checkout in "$RUNNER_TEMP"/decapod-ci-validation.*; do
            test -f "$checkout/.git/HEAD" || continue
            echo "::group::Generated projections changed in private validation checkout"
            git -C "$checkout" diff --no-ext-diff -- \
              .decapod/managed/specs .decapod/managed/Dockerfile.decapod \
              AGENTS.md CLAUDE.md CODEX.md GEMINI.md
            echo "::endgroup::"
          done
      - name: Upload measured source-CI custody
        if: always() && env.SOURCE_CI_CUSTODY_ARTIFACT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_CI_CUSTODY_ARTIFACT }}
          path: ${{ runner.temp }}/source-ci-evidence
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
