name: Decapod Validate

on:
  push:
    branches: [ main, master ]
  pull_request: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          
      - name: Configure Git for Private Dependencies
        env:
          GH_TOKEN: ${{ secrets.PROPODUS_READONLY_PAT }}
        run: |
          gh auth setup-git

      - name: Debug Git Access
        env:
          GH_TOKEN: ${{ secrets.PROPODUS_READONLY_PAT }}
        run: |
          git ls-remote https://github.com/DecapodLabs/propodus.git
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Decapod
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/decapod
          key: ${{ runner.os }}-decapod
      - name: Install Decapod
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_TERMINAL_PROMPT: "0"
          GH_TOKEN: ${{ secrets.PROPODUS_READONLY_PAT }}
        run: |
          cargo install --path . --all-features --force
      - name: Decapod Validate
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: 1
          GH_TOKEN: ${{ secrets.PROPODUS_READONLY_PAT }}
        run: |
          decapod init --proof
          decapod validate
