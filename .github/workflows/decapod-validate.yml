name: Decapod Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Decapod
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/decapod
          key: ${{ runner.os }}-decapod-v3-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs') }}
      - name: Install Decapod
        # Always rebuild from the PR tree so a restored cache binary cannot
        # evaluate against a different template/fingerprint generation path.
        run: cargo install --path . --force --locked
      - name: Decapod Validate
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: 1
          # Post-merge (push): tree-local binary fingerprints lag the last
          # published pin until release-artifact-sync heals them. Skip fingerprint
          # hard-fails here; PRs still enforce release-bound pins + drift.
          DECAPOD_VALIDATE_SKIP_FINGERPRINT_GATES: ${{ github.event_name == 'push' && '1' || '' }}
        run: |
          # Do not use `init --force` here: force-scaffold rewrites living specs
          # and entrypoints non-deterministically relative to a pure validate
          # refresh, which is exactly what the drift gate below forbids.
          # Bootstrap only when the control-plane layout is missing.
          if [ ! -d .decapod ]; then
            decapod init --proof
          fi
          decapod validate --refresh-specs
      - name: Ensure no spec or entrypoint drift
        # PR-only: post-merge must not fail because a newly compiled binary
        # rewrites fingerprints that release-artifact-sync owns.
        if: github.event_name == 'pull_request'
        # validate rewrites generated_at every run; that is not semantic drift.
        # Normalize it to HEAD before the exit-code check so only real content,
        # entrypoint, Dockerfile, or manifest hash drift fails CI.
        # Post-release failures usually mean the release PR bumped Cargo.toml
        # without committing regenerated release-bound entrypoints/specs —
        # run `cargo build --release && ./target/release/decapod validate --refresh-specs`
        # and commit the result (or use the release-artifact-sync workflow).
        run: |
          set -euo pipefail
          MANIFEST=".decapod/managed/specs/.manifest.json"
          if git cat-file -e "HEAD:${MANIFEST}" 2>/dev/null && [ -f "${MANIFEST}" ]; then
            OLD=$(git show "HEAD:${MANIFEST}" | sed -n 's/.*"generated_at": "\([^"]*\)".*/\1/p' | head -1)
            if [ -n "${OLD}" ]; then
              sed -i "s/\"generated_at\": \"[^\"]*\"/\"generated_at\": \"${OLD}\"/" "${MANIFEST}"
            fi
          fi
          if ! git diff --exit-code -- . ':!.decapod/governance/'; then
            echo "::error::Release-bound or living-spec drift detected after validate --refresh-specs."
            echo "Commit the regenerated AGENTS.md/CLAUDE.md/CODEX.md/GEMINI.md, managed Dockerfile, and .decapod/managed/specs/* from the evaluating binary."
            exit 1
          fi