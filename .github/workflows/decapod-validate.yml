name: Decapod Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Decapod
        uses: actions/checkout@v4
        with:
          path: decapod
          
      - name: Checkout Propodus
        uses: actions/checkout@v4
        with:
          repository: DecapodLabs/propodus
          token: ${{ secrets.GITHUB_TOKEN }}
          path: propodus
          ref: main
        continue-on-error: true

      - name: Patch Cargo.toml
        run: |
          cd decapod
          if [ -d "../propodus" ]; then
            echo "[patch.'https://github.com/DecapodLabs/propodus.git']" >> Cargo.toml
            echo "propodus = { path = '../propodus' }" >> Cargo.toml
          else
            echo "::error::Could not checkout propodus using GITHUB_TOKEN. Build will likely fail."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Decapod
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/decapod
          key: ${{ runner.os }}-decapod
      - name: Install Decapod
        run: |
          cd decapod
          cargo install --path . --all-features --force
      - name: Decapod Validate
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: 1
        run: |
          cd decapod
          decapod init --proof
          decapod validate
