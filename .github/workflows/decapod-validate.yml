name: Decapod Validate

on:
  push:
    branches: [ main, master ]
  pull_request: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          
      - name: Configure Git for Private Dependencies
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.PROPODUS_READONLY_PAT }}@github.com" > ~/.git-credentials
          # Ensure we don't have any conflicting insteadOf
          git config --global --remove-section url."https://github.com/" || true
          git config --global --remove-section url."https://x-access-token:${{ secrets.PROPODUS_READONLY_PAT }}@github.com/" || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Decapod
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/decapod
          key: ${{ runner.os }}-decapod
      - name: Install Decapod
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          cargo install --path . --all-features --force
      - name: Decapod Validate
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: 1
        run: |
          decapod init --proof
          decapod validate
