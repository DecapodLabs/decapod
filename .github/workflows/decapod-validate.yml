name: Decapod Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # This repository is the Decapod source. Evaluate with a tree-local binary so
      # pins match Cargo.toml (crates.io can lag mid-release and rewrite pins
      # e.g. 0.96.17 → 0.96.16, failing the drift gate).
      - name: Build tree-local Decapod
        run: cargo build --release --locked
      - name: Decapod Validate
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: 1
          # release-plz / release-labeled PRs: skip hard fingerprint fails while heal runs.
          # Code PRs enforce pins against the tree-local binary.
          DECAPOD_VALIDATE_SKIP_FINGERPRINT_GATES: ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'release') || startsWith(github.head_ref, 'release-plz-')) && '1' || '' }}
        run: |
          set -euo pipefail
          BIN=./target/release/decapod
          chmod +x "$BIN"
          if [ ! -d .decapod ]; then
            "$BIN" init --proof
          fi
          "$BIN" validate --refresh-specs
      - name: Ensure no spec or entrypoint drift
        # release-plz bumps Cargo.toml without pins; release-artifact-sync heals those PRs.
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release') && !startsWith(github.head_ref, 'release-plz-')
        # validate rewrites generated_at every run; that is not semantic drift.
        # Normalize it to HEAD before the exit-code check so only real content,
        # entrypoint, Dockerfile, or manifest hash drift fails CI.
        run: |
          set -euo pipefail
          MANIFEST=".decapod/managed/specs/.manifest.json"
          if git cat-file -e "HEAD:${MANIFEST}" 2>/dev/null && [ -f "${MANIFEST}" ]; then
            OLD=$(git show "HEAD:${MANIFEST}" | sed -n 's/.*"generated_at": "\([^"]*\)".*/\1/p' | head -1)
            if [ -n "${OLD}" ]; then
              sed -i "s/\"generated_at\": \"[^\"]*\"/\"generated_at\": \"${OLD}\"/" "${MANIFEST}"
            fi
          fi
          if ! git diff --exit-code -- . ':!.decapod/governance/'; then
            echo "::error::Release-bound or living-spec drift after validate --refresh-specs."
            echo "Commit regenerated entrypoints and .decapod/managed/specs from the tree-local evaluating binary."
            exit 1
          fi
