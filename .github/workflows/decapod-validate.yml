name: Decapod Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: DecapodLabs
          
      - name: Checkout Decapod
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          path: decapod
          
      - name: Checkout Propodus
        uses: actions/checkout@v4
        with:
          repository: DecapodLabs/propodus
          token: ${{ steps.generate-token.outputs.token }}
          path: propodus
        continue-on-error: true

      - name: Check files
        run: |
          ls -R
          if [ -d "propodus" ]; then
            echo "Propodus found"
          else
            echo "Propodus NOT found"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Decapod
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/decapod
          key: ${{ runner.os }}-decapod
      - name: Install Decapod
        run: |
          cd decapod
          # Patch Cargo.toml to use local path for propodus since we checked it out
          sed -i 's|git = "https://github.com/DecapodLabs/propodus.git", rev = "6ec9a3250328a66e648cf370db0cbdd600afa7cf"|path = "../propodus"|' Cargo.toml
          cargo install --path . --all-features --force
      - name: Decapod Validate
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: 1
        run: |
          cd decapod
          decapod init --proof
          decapod validate
