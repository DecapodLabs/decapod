name: Decapod Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Decapod
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/decapod
          key: ${{ runner.os }}-decapod-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs') }}
      - name: Install Decapod
        run: |
          if ! command -v decapod &> /dev/null; then
            cargo install --path .
          fi
      - name: Decapod Validate
        env:
          DECAPOD_VALIDATE_SKIP_GIT_GATES: 1
        run: |
          decapod init --proof --force
          decapod validate
      - name: Ensure no spec or entrypoint drift
        run: git diff --exit-code -- . ':!.decapod/governance/'
