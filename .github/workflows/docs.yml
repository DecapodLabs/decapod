name: Deploy Docs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p $HOME/mdbook
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/mdbook
          echo "${HOME}/mdbook" >> $GITHUB_PATH

      - name: Build with mdBook
        run: mdbook build docs/book

      # upload-pages-artifact is GitHub Pages-specific and is not implemented
      # by the Buildkite GHA runtime. Keep it for native GitHub Actions.
      - name: Upload artifact (GitHub Pages)
        if: github.ref == 'refs/heads/master' && env.BUILDKITE_BUILD_ID == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book

      # Preserve the built site as a Buildkite artifact so the build remains
      # useful while the Pages deployment action is unavailable there.
      - name: Upload artifact (Buildkite)
        if: github.ref == 'refs/heads/master' && env.BUILDKITE_BUILD_ID != ''
        run: |
          set -euo pipefail
          command -v buildkite-agent >/dev/null 2>&1
          buildkite-agent artifact upload "docs/book/book/**/*"

  deploy:
    # Buildkite can retain the site artifact, but it cannot currently execute
    # the GitHub Pages deployment action or its deployment-record protocol.
    if: github.ref == 'refs/heads/master' && env.BUILDKITE_BUILD_ID == ''
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
