name: Deploy Docs

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      native-owner: ${{ steps.owner.outputs.native_owner }}
    steps:
      - name: Select documentation deployment owner
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          native_owner=false
          # Imported jobs expose GITHUB_ACTIONS but omit Buildkite markers.
          # Pages delivery requires the protected native hosted identity.
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ] && [ -z "${BUILDKITE_BUILD_ID:-}" ] && [ "${BUILDKITE:-}" != "true" ] && [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            native_owner=true
          fi
          printf 'native_owner=%s\n' "$native_owner" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source context
        id: context
        uses: ./.github/actions/ci-context

      - name: Install mdBook
        run: |
          mkdir -p $HOME/mdbook
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/mdbook
          echo "${HOME}/mdbook" >> $GITHUB_PATH

      - name: Prepare shared source-CI profile
        uses: ./.github/actions/source-ci-profile

      - name: Build with mdBook
        run: '"$RUNNER_TEMP/source-ci-profile" run-ci --check docs-build'
      - name: Upload artifact (GitHub Pages)
        if: github.ref == 'refs/heads/master' && steps.owner.outputs.native_owner == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book

      # Preserve the built site with the supported generic artifact action so
      # the build remains useful while Pages deployment is unavailable there.
      - name: Upload artifact (Buildkite)
        if: github.ref == 'refs/heads/master' && steps.owner.outputs.native_owner != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/book/book

      - name: Upload measured source-CI custody
        if: always() && env.SOURCE_CI_CUSTODY_ARTIFACT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_CI_CUSTODY_ARTIFACT }}
          path: ${{ runner.temp }}/source-ci-evidence
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
  deploy:
    # Gate the whole job before the importer can attempt Pages deployment.
    if: github.ref == 'refs/heads/master' && needs.build.outputs.native-owner == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
