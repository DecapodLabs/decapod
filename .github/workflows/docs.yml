name: Deploy Docs

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source context
        id: context
        uses: ./.github/actions/ci-context

      - name: Install mdBook
        run: |
          mkdir -p $HOME/mdbook
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/mdbook
          echo "${HOME}/mdbook" >> $GITHUB_PATH

      - name: Prepare shared source-CI profile
        uses: ./.github/actions/source-ci-profile

      - name: Build with mdBook
        run: '"$RUNNER_TEMP/source-ci-profile" run-ci --check docs-build'
      - name: Upload artifact (GitHub Pages)
        if: github.ref == 'refs/heads/master' && env.BUILDKITE_BUILD_ID == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book

      # Preserve the built site with the supported generic artifact action so
      # the build remains useful while Pages deployment is unavailable there.
      - name: Upload artifact (Buildkite)
        if: github.ref == 'refs/heads/master' && env.BUILDKITE_BUILD_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/book/book

      - name: Upload measured source-CI custody
        if: always() && env.SOURCE_CI_CUSTODY_ARTIFACT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_CI_CUSTODY_ARTIFACT }}
          path: ${{ runner.temp }}/source-ci-evidence
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
  deploy:
    # Keep the event gate in a GitHub context: Buildkite does not expose env in
    # job-level conditions. The step-level split below handles the runtime.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        if: env.BUILDKITE_BUILD_ID == ''
        uses: actions/deploy-pages@v4

      - name: Retain Buildkite docs artifact
        if: env.BUILDKITE_BUILD_ID != ''
        run: |
          set -euo pipefail
          command -v buildkite-agent >/dev/null 2>&1
          echo "GitHub Pages deployment is unavailable in the Buildkite GHA runtime."
          echo "The built site is retained by the build job as a Buildkite artifact."
