#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with cargo-dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't cargo-dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (cargo-dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  release-publish:
    name: Release (Publish)
    runs-on: ubuntu-latest
    environment: release
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Generate GitHub App token (GitHub Actions)
        if: env.BUILDKITE_BUILD_ID == ''
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: DecapodLabs

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz (GitHub Actions)
        if: env.BUILDKITE_BUILD_ID == ''
        uses: release-plz/action@v0.5
        with:
          config: .github/release.toml
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"

      # Buildkite provides static job secrets, not the GitHub App token action's
      # short-lived output. Keep the GitHub path above unchanged and use the
      # documented release-plz CLI contract when this workflow is imported.
      - name: Run release-plz (Buildkite)
        if: env.BUILDKITE_BUILD_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_TOKEN:?Configure GITHUB_TOKEN as a Buildkite secret for release-plz}"
          : "${CARGO_REGISTRY_TOKEN:?Configure CARGO_REGISTRY_TOKEN as a Buildkite secret for release-plz}"
          if ! command -v release-plz >/dev/null 2>&1; then
            cargo install --locked release-plz
          fi
          release-plz release --config .github/release.toml
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"

      # Intentionally NO post-release-plz entrypoint/fingerprint heal and no
      # Release Artifact Sync workflow. Master pins remain the Decapod version
      # that generated master. The next user/agent PR with a newer installed
      # binary advances entrypoints/Dockerfile/manifest via local validate gates.

  # Run 'cargo dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-latest"
    # Cargo-dist planning is useful for release-plz PRs and tags, not every
    # code PR. Keeping the job scoped to those release surfaces prevents a
    # normal PR from acquiring a release-plan check it cannot publish.
    if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-')) || (github.event_name == 'push' && github.ref != 'refs/heads/master')
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.plan.outputs.tag }}
      tag-flag: ${{ steps.plan.outputs.tag_flag }}
      publishing: ${{ steps.plan.outputs.publishing }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cargo-dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.22.1/cargo-dist-installer.sh | sh"
      - name: Cache cargo-dist
        uses: actions/upload-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/cargo-dist
      # Keep PR planning and tag publishing explicit in shell so the Buildkite
      # adapter does not have to interpolate runtime shell variables while it
      # uploads the imported workflow.
      - id: plan
        run: bash .github/scripts/release-plan.sh
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  publish-decapod-image:
    name: Publish Decapod GHCR Image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: glibc
            # Keep the public family tag stable across Debian codename upgrades;
            # the current concrete glibc base is debian:bookworm-slim below.
            tag_suffix: "-debian"
            build_image: rust:1.96.1-slim-bookworm
            runtime_image: debian:bookworm-slim
          - variant: musl
            tag_suffix: "-alpine"
            build_image: rust:1.96.1-alpine
            runtime_image: alpine:3.20
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (GitHub Actions)
        if: env.BUILDKITE_BUILD_ID == ''
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx (GitHub Actions)
        if: env.BUILDKITE_BUILD_ID == ''
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (GitHub Actions)
        if: env.BUILDKITE_BUILD_ID == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA (GitHub Actions)
        if: env.BUILDKITE_BUILD_ID == ''
        id: commit
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Extract image metadata (GitHub Actions)
        if: env.BUILDKITE_BUILD_ID == ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/decapodlabs/decapod
          tags: |
            type=raw,value=${{ github.ref_name }}${{ matrix.tag_suffix }}
      - name: Build and push Decapod image (GitHub Actions)
        if: env.BUILDKITE_BUILD_ID == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: assets/Dockerfile.workspace
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DECAPOD_VERSION=${{ github.ref_name }}
            DECAPOD_REVISION=${{ steps.commit.outputs.sha_short }}
            DECAPOD_BUILD_IMAGE=${{ matrix.build_image }}
            DECAPOD_RUNTIME_IMAGE=${{ matrix.runtime_image }}
      # The Buildkite runtime does not emulate the Docker setup actions. Keep
      # the native GitHub Actions path above and perform the same build with
      # the Docker CLI when this job is imported into Buildkite.
      - name: Build and push Decapod image (Buildkite)
        if: env.BUILDKITE_BUILD_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_TOKEN:?Configure GITHUB_TOKEN as a Buildkite secret for GHCR publishing}"
          : "${GITHUB_REF_NAME:?Buildkite GHA must provide GITHUB_REF_NAME for tag publishing}"
          short_sha="${GITHUB_SHA:-${BUILDKITE_COMMIT:-}}"
          short_sha="${short_sha:0:7}"
          docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.0 --install all
          if ! docker buildx inspect decapod-builder >/dev/null 2>&1; then
            docker buildx create --name decapod-builder --driver docker-container --use
          else
            docker buildx use decapod-builder
          fi
          docker buildx inspect --bootstrap
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR:-github-actions[bot]}" --password-stdin
          docker buildx build \
            --context . \
            --file assets/Dockerfile.workspace \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag "ghcr.io/decapodlabs/decapod:${GITHUB_REF_NAME}${{ matrix.tag_suffix }}" \
            --build-arg "DECAPOD_VERSION=${GITHUB_REF_NAME}" \
            --build-arg "DECAPOD_REVISION=${short_sha}" \
            --build-arg "DECAPOD_BUILD_IMAGE=${{ matrix.build_image }}" \
            --build-arg "DECAPOD_RUNTIME_IMAGE=${{ matrix.runtime_image }}"
      - name: Verify anonymous GHCR pull
        env:
          IMAGE_TAG: ${{ github.ref_name }}${{ matrix.tag_suffix }}
        run: |
          set -euo pipefail
          token="$(curl --fail-with-body --silent --show-error --location \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:decapodlabs/decapod:pull" \
            | jq --raw-output '.token // empty')"
          test -n "$token"
          curl --fail-with-body --silent --show-error --location \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/decapodlabs/decapod/manifests/$IMAGE_TAG" \
            >/dev/null

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ matrix.targets }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Buildkite validates workflow matrices before applying the job-level
      # `if`, and cannot expand cargo-dist's runtime object on plan-only runs.
      # Keep the four targets declared in workspace.metadata.dist explicit so
      # skipped plan checks validate while real tag/upload builds remain stable.
      matrix:
        include:
          - targets: aarch64-apple-darwin
            runner: macos-latest
            install_dist: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.22.1/cargo-dist-installer.sh | sh"
            packages_install: "true"
            dist_args: "--artifacts=local --target=aarch64-apple-darwin"
          - targets: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            install_dist: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.22.1/cargo-dist-installer.sh | sh"
            packages_install: "true"
            dist_args: "--artifacts=local --target=aarch64-unknown-linux-gnu"
          - targets: x86_64-apple-darwin
            runner: macos-latest
            install_dist: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.22.1/cargo-dist-installer.sh | sh"
            packages_install: "true"
            dist_args: "--artifacts=local --target=x86_64-apple-darwin"
          - targets: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            install_dist: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.22.1/cargo-dist-installer.sh | sh"
            packages_install: "true"
            dist_args: "--artifacts=local --target=x86_64-unknown-linux-gnu"
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ matrix.targets }}-dist-manifest.json
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cargo-dist
        run: ${{ matrix.install_dist }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Install aarch64 Linux cross compiler
        if: ${{ runner.os == 'Linux' && contains(matrix.targets, 'aarch64-unknown-linux-gnu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          cargo dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "cargo dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-local-${{ matrix.targets }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cached cargo-dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/cargo-dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          cargo dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "cargo dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-latest"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cached cargo-dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/cargo-dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          cargo dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          release_tag="${{ needs.plan.outputs.tag }}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
            gh release upload "$release_tag" artifacts/* --clobber
          else
            gh release create "$release_tag" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
          fi

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
