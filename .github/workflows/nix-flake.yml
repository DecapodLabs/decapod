name: Nix Flake

on:
  # Buildkite GHA currently schedules this workflow for open pull requests
  # despite the closed-only filter. A master push is the durable merge event;
  # the shell gate below retains the release-merge-only behavior.
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Packaging proof: packages.default must build from the committed Cargo.lock
  # on each natively proven OS, and the locked rust-overlay must supply the
  # repository-pinned Rust channel. Fail closed; CI never mutates flake.lock.
  build:
    name: nix (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native x86_64 Linux (ubuntu-latest is x64).
          - os: ubuntu-latest
            expected_system: x86_64-linux
          # Native aarch64 Darwin: macos-latest is Apple Silicon (arm64) per
          # GitHub-hosted runners docs (not Intel).
          - os: macos-latest
            expected_system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Gate to release merge
        id: release-gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          parents=( $(git rev-list --parents -n 1 "$GITHUB_SHA") )
          if [ "${#parents[@]}" -lt 3 ]; then
            echo "Not a merge commit; skipping Nix packaging proof."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          second_parent="${parents[2]}"
          subject="$(git log -1 --format=%s "$second_parent")"
          if [[ "$subject" == chore:\ release\ v* ]]; then
            echo "Release merge detected: $subject"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release-plz merge commit: $subject"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.release-gate.outputs.run == 'true'
        uses: cachix/install-nix-action@v31

      - name: Print native system and Nix version
        if: steps.release-gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          nix --version
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          echo "builtins.currentSystem=${system}"
          if [ "${system}" != "${{ matrix.expected_system }}" ]; then
            echo "::error::expected Nix system ${{ matrix.expected_system }}, got ${system} (runner label ${{ matrix.os }} may have changed architecture)"
            exit 1
          fi

      - name: Verify repository Rust toolchain via locked rust-overlay
        if: steps.release-gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          set +e
          nix build --print-build-logs .#checks.$(nix eval --impure --raw --expr builtins.currentSystem).rust-toolchain
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo "::error::The repository-pinned Rust channel could not be resolved through the committed rust-overlay lock."
            echo
            echo "If rust-toolchain.toml (or .config/build/rust-toolchain.toml) changed, refresh only the rust-overlay input,"
            echo "review the resulting flake.lock diff, and commit both changes:"
            echo
            echo "  nix flake update rust-overlay"
            echo
            echo "CI does not update or commit flake.lock automatically."
            exit "$status"
          fi
          echo "rust-toolchain check ok:"
          cat ./result

      - name: Build packages.default
        if: steps.release-gate.outputs.run == 'true'
        run: nix build --print-build-logs

      - name: Smoke-check the built binary
        if: steps.release-gate.outputs.run == 'true'
        run: ./result/bin/decapod system version
