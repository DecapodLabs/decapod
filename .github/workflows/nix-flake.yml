name: Nix Flake

on:
  # Buildkite GHA currently schedules this workflow for open pull requests
  # despite the closed-only filter. A master push is the durable merge event;
  # the shell gate below retains the release-merge-only behavior.
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Credential-free owner gate. Buildkite imports workflows and resolves
  # secrets before step conditions, so only a separate native job may publish.
  publication-owner:
    name: Select Cachix publisher
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      publish: ${{ steps.owner.outputs.publish }}
    steps:
      - name: Authorize native release publication
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ] &&
             [ -z "${BUILDKITE_BUILD_ID:-}" ] &&
             [ "${BUILDKITE:-}" != "true" ] &&
             [ "${GITHUB_ACTIONS:-}" = "true" ] &&
             [ "${GITHUB_EVENT_NAME:-}" = "push" ] &&
             [ "${GITHUB_REF:-}" = "refs/heads/master" ]; then
            # Fetch only the protected pushed commit and its immediate
            # parents, anonymously: this owner has no GITHUB_TOKEN permissions.
            git init -q .
            git remote add origin https://github.com/DecapodLabs/decapod.git
            git -c protocol.version=2 fetch --quiet --no-tags --depth=2 origin "$GITHUB_SHA"
            read -r -a parents <<< "$(git rev-list --parents -n 1 FETCH_HEAD)"
            if [ "${#parents[@]}" -eq 3 ]; then
              subject="$(git log -1 --format=%s "${parents[2]}")"
              if [[ "$subject" == chore:\ release\ v* ]]; then
                publish=true
                echo "Native release merge detected: $subject"
              fi
            fi
          fi
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" != "true" ]; then
            echo "No native release publication permitted."
          fi

  # Packaging proof: packages.default must build from the committed Cargo.lock
  # on each natively proven OS, and the locked rust-overlay must supply the
  # repository-pinned Rust channel. Fail closed; CI never mutates flake.lock.
  build:
    name: nix (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native x86_64 Linux (ubuntu-latest is x64).
          - os: ubuntu-latest
            expected_system: x86_64-linux
          # Native aarch64 Darwin: macos-latest is Apple Silicon (arm64) per
          # GitHub-hosted runners docs (not Intel).
          - os: macos-latest
            expected_system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Gate to release merge
        id: release-gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          parents=( $(git rev-list --parents -n 1 "$GITHUB_SHA") )
          if [ "${#parents[@]}" -lt 3 ]; then
            echo "Not a merge commit; skipping Nix packaging proof."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          second_parent="${parents[2]}"
          subject="$(git log -1 --format=%s "$second_parent")"
          if [[ "$subject" == chore:\ release\ v* ]]; then
            echo "Release merge detected: $subject"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release-plz merge commit: $subject"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.release-gate.outputs.run == 'true'
        uses: cachix/install-nix-action@v31

      - name: Print native system and Nix version
        if: steps.release-gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          nix --version
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          echo "builtins.currentSystem=${system}"
          if [ "${system}" != "${{ matrix.expected_system }}" ]; then
            echo "::error::expected Nix system ${{ matrix.expected_system }}, got ${system} (runner label ${{ matrix.os }} may have changed architecture)"
            exit 1
          fi

      - name: Verify repository Rust toolchain via locked rust-overlay
        if: steps.release-gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          set +e
          nix build --print-build-logs .#checks.$(nix eval --impure --raw --expr builtins.currentSystem).rust-toolchain
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo "::error::The repository-pinned Rust channel could not be resolved through the committed rust-overlay lock."
            echo
            echo "If rust-toolchain.toml (or .config/build/rust-toolchain.toml) changed, refresh only the rust-overlay input,"
            echo "review the resulting flake.lock diff, and commit both changes:"
            echo
            echo "  nix flake update rust-overlay"
            echo
            echo "CI does not update or commit flake.lock automatically."
            exit "$status"
          fi
          echo "rust-toolchain check ok:"
          cat ./result

      - name: Build packages.default
        if: steps.release-gate.outputs.run == 'true'
        run: nix build --print-build-logs

      - name: Smoke-check the built binary
        if: steps.release-gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/result/bin/decapod"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_dir"' EXIT
          cd "$smoke_dir"
          "$binary" system version

      # Reproducibility proof (#1176): on x86_64-linux a second build from the
      # same locked inputs must be byte-identical, so a consumer can check a
      # cached binary with `nix build --rebuild`. aarch64-darwin is not checked,
      # because with upstream Nix the linker UUID can still differ there
      # (docs/book/src/reference/nix.md).
      - name: Check that a rebuild is byte-identical
        if: steps.release-gate.outputs.run == 'true' && matrix.expected_system == 'x86_64-linux'
        run: nix build --rebuild --print-build-logs

  # The publisher rebuilds from the committed lock. It cannot inherit a
  # different runner's Nix store; all publication candidates are smoke-checked.
  publish:
    name: cachix (${{ matrix.os }})
    needs: [publication-owner, build]
    if: needs.publication-owner.outputs.publish == 'true' && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expected_system: x86_64-linux
          - os: macos-latest
            expected_system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Verify native Nix system
        run: |
          set -euo pipefail
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          test "$system" = "${{ matrix.expected_system }}"

      - name: Verify locked Rust toolchain
        run: nix build --print-build-logs .#checks.${{ matrix.expected_system }}.rust-toolchain

      - name: Build packages.default
        run: nix build --print-build-logs

      - name: Smoke-check publication candidate
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/result/bin/decapod"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_dir"' EXIT
          cd "$smoke_dir"
          "$binary" system version

      - name: Check Linux publication candidate is reproducible
        if: matrix.expected_system == 'x86_64-linux'
        run: nix build --rebuild --print-build-logs

      - name: Publish verified closure to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "::error::CACHIX_AUTH_TOKEN must be a write-capable token for decapod.cachix.org"
            exit 1
          fi
          nix run --inputs-from . nixpkgs#cachix -- push decapod ./result
