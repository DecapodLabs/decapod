name: Diagnose billing GitHub publication with read-only requests

on:
  push:
    branches: [ops/stale-billing-publication-20261111]
    paths-ignore:
      - assets/tools/maintenance/stale-billing-publication-20261111/replies/**

permissions:
  contents: read

concurrency:
  group: stale-billing-publication-20261111
  cancel-in-progress: false

env:
  OPERATIONS_PATH: assets/tools/maintenance/stale-billing-publication-20261111

jobs:
  diagnose:
    if: github.repository == 'DecapodLabs/decapod' && github.ref == 'refs/heads/ops/stale-billing-publication-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: operations
          persist-credentials: false
      - name: Run only bounded read-only transport probes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/diagnose_github_publication.py" \
            --directory "$RUNNER_TEMP/billing-github-read-diagnostics" \
            --recipient "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/custody-recipient.pem"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: billing-github-read-diagnostics
          path: ${{ runner.temp }}/billing-github-read-diagnostics/public/
          if-no-files-found: error
          retention-days: 90
