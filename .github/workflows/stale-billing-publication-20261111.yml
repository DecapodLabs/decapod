name: Resume original billing task through native Decapod

on:
  push:
    branches: [ops/stale-billing-publication-20261111]
    paths-ignore:
      - assets/tools/maintenance/stale-billing-publication-20261111/replies/**

permissions:
  contents: read

concurrency:
  group: stale-billing-publication-20261111
  cancel-in-progress: false

env:
  BASE_SHA: c5de35a89b27e788169612ae71681e45c13bf71a
  OPERATIONS_PATH: assets/tools/maintenance/stale-billing-publication-20261111

jobs:
  publish:
    if: github.repository == 'DecapodLabs/decapod' && github.ref == 'refs/heads/ops/stale-billing-publication-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: operations
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c5de35a89b27e788169612ae71681e45c13bf71a
          path: subject
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-controller-v01381
          run-id: 43102667924
          github-token: ${{ github.token }}
          path: controller
      - name: Verify independently accepted official controller
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - "$GITHUB_WORKSPACE/controller" <<'PY'
          import hashlib, json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          metadata = json.loads((p / 'controller.json').read_text())
          release = '4ccc4ed2196e7b1c8f8f614b3d38213c267ae16a'
          assert metadata['release'] == 'v0.138.1'
          assert metadata['accepted_base'] == release
          assert metadata['release_tag_commit'] == release
          assert metadata['release_id'] == 442197747
          assert metadata['asset_id'] == 736951470
          assert metadata['archive_sha256'] == 'sha256:fff1b820e3a2983273ce137600086a510d7df7d57b23f8e401ef302a7dec68dd'
          expected = '22f26c69e7f6de5f813c11ee21d8fc2a5776b6a1ce477e13d835a9e210c69217'
          assert metadata['binary_sha256'] == expected
          assert hashlib.sha256((p / 'decapod').read_bytes()).hexdigest() == expected
          (p / 'decapod').chmod(0o700)
          PY
      - name: Prepare an ephemeral recipient for original private task custody
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/custody_relay.py" prepare \
            --manifest "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/billing-resume.json" \
            --directory "$RUNNER_TEMP/billing-custody-relay"
      - name: Publish only the current runner public custody recipient
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: billing-resume-recipient
          path: ${{ runner.temp }}/billing-custody-relay/public/
          retention-days: 7
      - name: Receive the authenticated original task and pending material
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/custody_relay.py" receive \
            --manifest "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/billing-resume.json" \
            --directory "$RUNNER_TEMP/billing-custody-relay"
      - name: Resume original task, restore recorded source, and publish after full readiness
        working-directory: subject
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PATH="$GITHUB_WORKSPACE/controller:$PATH"
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          python3 "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/resume_billing.py" \
            --manifest "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/billing-resume.json" \
            --patch "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/billing.patch" \
            --resume-private-dir "$RUNNER_TEMP/billing-custody-relay/recovery" \
            --custody-recipient "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/custody-recipient.pem" \
            --output "$RUNNER_TEMP/billing-publication-result" \
            --publish-timeout 3600
      - name: Report observed native publication outcome
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/billing-publication-result/billing.json" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          if p.is_file():
              value = json.loads(p.read_text())
              keys = ('status', 'branch', 'task', 'head_sha', 'pr_url', 'full_boundary_passed', 'custody_exported', 'blocker', 'transfer_error')
              print(json.dumps({k: value[k] for k in keys if k in value}, indent=2))
          else:
              print('No terminal native result. No publication or custody success is inferred.')
          PY
      - name: Retain source recovery, native proof, and encrypted custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: billing-native-resume
          path: ${{ runner.temp }}/billing-publication-result/
          if-no-files-found: warn
          retention-days: 90
