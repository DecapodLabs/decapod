# One-shot branch-only native governance reconstruction; never ships in the final PR.
name: One-time governed CI repair commit
on:
  push:
    branches: [ 'agent/chatgpt-master-actions/cicd-20261116' ]
permissions:
  contents: write
jobs:
  rebuild-governance:
    if: github.repository == 'DecapodLabs/decapod' && github.ref == 'refs/heads/agent/chatgpt-master-actions/cicd-20261116'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
      - name: Build authentic Decapod governance CLI
        run: |
          set -euo pipefail
          cargo build --locked --quiet --config profile.dev.debug=0 --features build-tools --bin decapod
      - name: Rebuild a single governed authored commit from immutable accepted master
        env:
          ACCEPTED_BASE: '5118ef419249ab916c538221f3f6c98a6e1678fd'
          APPROVED_SOURCE: '3adb3dea001b4564d1c7759e7cf328733128cc49'
        run: |
          set -euo pipefail
          umask 077
          remote_branch='agent/chatgpt-master-actions/cicd-20261116'
          test "$(git cat-file -t "$ACCEPTED_BASE")" = commit
          test "$(git cat-file -t "$APPROVED_SOURCE")" = commit
          test "$(git rev-parse "$APPROVED_SOURCE^")" = "$ACCEPTED_BASE"
          test "$(git rev-parse "$APPROVED_SOURCE^{tree}")" != "$(git rev-parse "$ACCEPTED_BASE^{tree}")"
          final="$RUNNER_TEMP/decapod-governed-final"
          git worktree add --detach "$final" "$ACCEPTED_BASE"
          git -C "$final" switch -c agent/chatgpt-ci-repair-governed-final
          if ! git -C "$final" show-ref --verify --quiet refs/heads/master; then
            git -C "$final" branch master "$ACCEPTED_BASE"
          fi
          git -C "$final" config user.name 'Decapod CI Repair'
          git -C "$final" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd "$final"
          bin="$GITHUB_WORKSPACE/target/debug/decapod"
          "$bin" govern artifacts begin-pr --id ci-master-actions-20261116 --base-branch master
          "$bin" govern plan init --title 'Repair red master GitHub Actions' \
            --intent 'Recover Decapod master CI by patching vulnerable crate pins, restoring generated release projections, and limiting docs publishing privileges' \
            --proof-hook 'CI source validation on exact PR SHA' \
            --stop-condition 'Retain native governance and strict dependency/build gates'
          git restore --source="$APPROVED_SOURCE" --staged --worktree -- \
            .decapod/managed/Dockerfile.decapod \
            .decapod/managed/specs/.manifest.json \
            .decapod/managed/specs/ARCHITECTURE.md \
            .decapod/managed/specs/INTENT.md \
            .decapod/managed/specs/INTERFACES.md \
            .decapod/managed/specs/OPERATIONS.md \
            .decapod/managed/specs/README.md \
            .decapod/managed/specs/SECURITY.md \
            .decapod/managed/specs/SEMANTICS.md \
            .decapod/managed/specs/VALIDATION.md \
            .github/workflows/decapod-validate.yml \
            .github/workflows/docs_autosync.yml \
            AGENTS.md \
            CLAUDE.md \
            CODEX.md \
            Cargo.lock \
            GEMINI.md \
            MODULE.bazel.lock
          "$bin" govern trajectory init \
            --run-id ci-master-actions-20261116 \
            --original-intent 'Repair the red master GitHub Actions jobs' \
            --derived-intent 'Patch reported vulnerabilities, fix documentation publisher access, preserve strict cargo/Bazel locks and native spec validation' \
            --boundary 'Only CI workflows, patched lockfiles and kernel-generated release projections' \
            --scope '.github/workflows/' --scope 'Cargo.lock' --scope 'MODULE.bazel.lock' --scope '.decapod/managed/' \
            --destination 'Governed PR to master' --phase validation --next-transition publish
          "$bin" govern plan review-spec --path .decapod/managed/specs/INTERFACES.md \
            --disposition unchanged-with-reason \
            --reason 'No Decapod CLI, RPC, cloud or service interface changed; only CI permissions, dependency versions and native generated release projections changed.'
          "$bin" govern plan review-spec --path .decapod/managed/specs/ARCHITECTURE.md \
            --disposition unchanged-with-reason \
            --reason 'The kernel architecture and CI topology remain unchanged; Bazel dependency metadata and generated release pins are updated to the exact candidate.'
          "$bin" govern plan review-spec --path .decapod/managed/specs/SECURITY.md \
            --disposition unchanged-with-reason \
            --reason 'The published RustSec patches are in Cargo and Bazel locks; only scheduled docs publishing gains contents and PR write permissions; source validation tokens remain read only.'
          git diff --cached --stat
          "$bin" govern artifacts checkpoint \
            --id ci-master-actions-20261116-checkpoint \
            --summary 'Patch quinn-udp and rustix, synchronize Bazel lock and native v0.148.2 projections, scope docs bot permissions and preserve CI diagnostics' \
            --proof-ref 'https://github.com/DecapodLabs/decapod/actions/runs/43847440363' \
            --proof-ref 'https://github.com/DecapodLabs/decapod/actions/runs/43847965611'
          git add .decapod/governance.json
          git commit -m 'fix(ci): restore verified master Actions and current governed custody'
          "$bin" govern artifacts verify-checkpoints \
            --base-branch "$ACCEPTED_BASE" --head-ref HEAD --target-base master --publication-material
          test -z "$(git status --porcelain)"
          # The lease prevents this helper from replacing any newer author work.
          git push --force-with-lease="refs/heads/$remote_branch:$GITHUB_SHA" origin "HEAD:refs/heads/$remote_branch"
