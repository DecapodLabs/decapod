name: Bootstrap issue 1628 native custody

on:
  push:
    branches: [ops/issue1628-native-20261111]

permissions:
  contents: read

concurrency:
  group: issue1628-native-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'DecapodLabs/decapod' && github.ref == 'refs/heads/ops/issue1628-native-20261111'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    timeout-minutes: 25
    steps:
      - name: Install bounded bootstrap dependencies in the actual job container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3 openssl ca-certificates curl xz-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: operations
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c5de35a89b27e788169612ae71681e45c13bf71a
          path: subject
          fetch-depth: 0
          persist-credentials: true
      - name: Admit the task through the official released native controller
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          python3 "$GITHUB_WORKSPACE/operations/assets/tools/maintenance/issue1628-native-20261111/bootstrap.py" \
            --slug decapod \
            --certificate "$GITHUB_WORKSPACE/operations/assets/tools/maintenance/issue1628-native-20261111/custody-recipient.pem" \
            --output "$RUNNER_TEMP/issue1628-native-result"
      - name: Preserve actual admission and encrypted custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1628-native-decapod
          path: ${{ runner.temp }}/issue1628-native-result/
          if-no-files-found: warn
          retention-days: 90
