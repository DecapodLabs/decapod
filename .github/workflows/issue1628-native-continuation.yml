name: Continue issue 1628 governed client

on:
  push:
    branches: [ops/issue1628-native-20261111]
    paths-ignore:
      - assets/tools/maintenance/issue1628-native-20261111/replies/**

permissions:
  contents: read

concurrency:
  group: issue1628-native-decapod
  cancel-in-progress: false

jobs:
  continue:
    if: github.repository == 'DecapodLabs/decapod' && github.ref == 'refs/heads/ops/issue1628-native-20261111'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    timeout-minutes: 160
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      OPERATIONS_PATH: assets/tools/maintenance/issue1628-native-20261111
      TMPDIR: /root/issue1628-tmp
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - name: Prepare actual native container
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /root/issue1628-tmp
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git gh python3 openssl ca-certificates curl xz-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: operations
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c5de35a89b27e788169612ae71681e45c13bf71a
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust and probe the released native controller
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/install_rust.py"
          echo /usr/local/cargo/bin >> "$GITHUB_PATH"
          python3 "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/install_controller.py" /root/issue1628-controller-probe
          cd /root
          /root/issue1628-controller-probe/decapod docs ingest > /root/issue1628-controller-orientation.txt
      - name: Prepare exact private custody receiver
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/custody_relay.py" prepare \
            --slug decapod \
            --report "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/decapod-bootstrap-result.json" \
            --directory /root/issue1628-relay
      - name: Publish only the ephemeral receiver certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1628-decapod-receiver
          path: /root/issue1628-relay/public/
          if-no-files-found: error
          retention-days: 2
      - name: Receive authenticated private native transfer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/custody_relay.py" receive \
            --slug decapod \
            --report "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/decapod-bootstrap-result.json" \
            --directory /root/issue1628-relay
      - name: Materialize reviewed source and continue original native task
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/unpack_client.py" \
            "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/client-material.b64" \
            "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/decapod-continuation.json" \
            "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/material"
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE/subject" /root/issue1628-subject
          cd /root/issue1628-subject
          git remote set-url origin https://github.com/DecapodLabs/decapod.git
          git checkout --detach c5de35a89b27e788169612ae71681e45c13bf71a
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          gh auth setup-git
          python3 "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/continue_decapod.py" \
            --material "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/material" \
            --manifest "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/decapod-continuation.json" \
            --native-transfer /root/issue1628-relay/native-transfer.json \
            --certificate "$GITHUB_WORKSPACE/operations/$OPERATIONS_PATH/custody-recipient.pem" \
            --output "$RUNNER_TEMP/issue1628-decapod-continuation"
      - name: Preserve actual readiness blocker and encrypted task custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1628-decapod-continuation
          path: ${{ runner.temp }}/issue1628-decapod-continuation/
          if-no-files-found: warn
          retention-days: 90
