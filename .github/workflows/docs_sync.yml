name: Documentation Sync

on:
  push:
    branches: [ "decapod/preflight/**" ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source context
        id: context
        uses: ./.github/actions/ci-context
      - name: Prepare shared source-CI profile
        uses: ./.github/actions/source-ci-profile
      - name: Select the same documentation obligation for PR and snapshot
        id: changed
        env:
          CHANGE_BASE: ${{ steps.context.outputs.merge_base }}
          CHANGE_HEAD: ${{ steps.context.outputs.head }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/source-ci-profile" docs-changed --base "$CHANGE_BASE" --head "$CHANGE_HEAD" >> "$GITHUB_OUTPUT"
      - name: Prove immutable PR documentation
        if: steps.changed.outputs.changed == 'true'
        uses: ./.github/actions/docs-drift
        with:
          base-sha: ${{ steps.context.outputs.base }}
          head-sha: ${{ steps.context.outputs.head }}
      - name: Record proven documentation non-applicability
        if: steps.changed.outputs.changed == 'false'
        run: echo 'No documentation inputs changed in the verified immutable source range; documentation generation is not applicable.'
      - name: Upload measured source-CI custody
        if: always() && env.SOURCE_CI_CUSTODY_ARTIFACT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_CI_CUSTODY_ARTIFACT }}
          path: ${{ runner.temp }}/source-ci-evidence
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
