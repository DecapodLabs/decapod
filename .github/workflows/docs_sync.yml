name: Documentation Sync

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**/*.rs'
      - 'docs/**/*.md'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: DecapodLabs
          
      - name: Checkout Decapod
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
          path: decapod

      - name: Checkout Propodus
        uses: actions/checkout@v4
        with:
          repository: DecapodLabs/propodus
          token: ${{ steps.generate-token.outputs.token }}
          path: propodus

      - name: Patch Cargo.toml
        run: |
          cd decapod
          echo "[patch.'https://github.com/DecapodLabs/propodus.git']" >> Cargo.toml
          echo "propodus = { path = '../propodus' }" >> Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Decapod
        run: |
          cd decapod
          cargo build --all-features

      - name: Get changed files
        id: changed-files
        run: |
          cd decapod
          git fetch origin master
          FILES=$(git diff --name-only origin/master HEAD | xargs)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Run Docs Build
        run: |
          cd decapod
          FILES="${{ steps.changed-files.outputs.files }}"
          if [ -n "$FILES" ]; then
            ./target/debug/decapod docs build --touched $FILES
          else
            ./target/debug/decapod docs build
          fi

      - name: Commit and push changes
        run: |
          cd decapod
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/agent/command-contracts.md docs/agent/config-schema.md
          if git diff --staged --quiet; then
            echo "No doc changes detected."
          else
            git commit -m "docs: autogenerate/sync command contracts"
            git push
          fi
