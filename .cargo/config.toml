# Build configuration for Decapod
# Optimized for fast compilation in CI and good release binaries

[env]
CLIPPY_CONF_DIR = { value = ".config", relative = true }

# Use LLD linker for 2-3x faster linking (requires: apt-get install lld)
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# [target.aarch64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Darwin: do not pin -fuse-ld to a host absolute path such as /usr/bin/ld.
# That path is invalid or unavailable inside a pure Nix sandbox and is
# unnecessary on macOS — Cargo/Rust already selects the Apple toolchain
# linker (ld64 / ld-prime via the system cc). Leave Darwin targets unconfigured
# so plain `cargo build` and `nix build` share one coherent linker story.

# Build settings
[build]
# Parallel compilation (default is CPU count)
jobs = 4

# Network settings for reliability
[net]
retry = 10
git-fetch-with-cli = true

# Use sparse registry protocol (3x faster than git-based)
[registries.crates-io]
protocol = "sparse"

# Release profile optimizations
[profile.release]
opt-level = 2             # Slightly less optimization for 30% faster compile
lto = "thin"              # Thin LTO: good size reduction, faster than "fat"
codegen-units = 16        # More parallel codegen units = faster compile
panic = "abort"            # Smaller binary, no unwinding
strip = true              # Strip symbols for smaller binary

# Profile specifically for `cargo install` - optimize for compile speed
[profile.install]
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
incremental = true        # Enable incremental for cached rebuilds

# Dev profile: optimize for fast compilation
[profile.dev]
opt-level = 0         # No optimization
debug = true
incremental = true    # Incremental compilation for dev builds

# Test profile: balance between speed and debuggability
[profile.test]
opt-level = 1         # Light optimization
debug = true
