[package]
name = "decapod-vega-infer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
license = "MIT"

[workspace]

[[bin]]
name = "decapod-vega-infer"
path = "../vega_infer.rs"

[features]
default = ["vega-native"]
vega-native = []
cuda = ["dep:candle-vllm-cuda", "dep:parking_lot"]

[dependencies]
decapod = { path = "../../..", default-features = false }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tempfile = "3"
libc = "0.2"
libm = "0.2"
fancy-regex = "0.17"
unicode-normalization = "0.1"
parquet = { version = "=59.3.1", default-features = false, features = ["snap", "json"] }
safetensors = "0.7"
candle-core = { git = "https://github.com/guoqingbao/candle.git", rev = "23a6f38", default-features = false }
candle-nn = { git = "https://github.com/guoqingbao/candle.git", rev = "23a6f38", default-features = false }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[package.metadata.cargo-machete]
# Required by BackboneError in the path-included ../../../src/decapod/core/vega_backbone.rs.
ignored = ["thiserror"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-vllm = { git = "https://github.com/EricLBuehler/candle-vllm", rev = "b1055eca63de76b548d0d4b0daa96ff8cd1d0596", default-features = false, features = ["metal"] }
# Match the upstream source selector exactly; Cargo.lock pins its full commit.
candle-core = { git = "https://github.com/guoqingbao/candle.git", rev = "23a6f38", default-features = false, features = ["metal"] }
candle-nn = { git = "https://github.com/guoqingbao/candle.git", rev = "23a6f38", default-features = false, features = ["metal"] }
parking_lot = "0.12"
attention-rs = { git = "https://github.com/guoqingbao/attention.rs.git", rev = "f22e42c", default-features = false, features = ["metal"] }

# Preserve the upstream public API; only synchronize recurrence shared memory.
[patch."https://github.com/guoqingbao/attention.rs.git"]
metal-kernels = { path = "vendor/metal-kernels" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-vllm-cuda = { package = "candle-vllm", git = "https://github.com/EricLBuehler/candle-vllm", rev = "b1055eca63de76b548d0d4b0daa96ff8cd1d0596", optional = true, default-features = false, features = ["cuda"] }
parking_lot = { version = "0.12", optional = true }
