schema_version = "1.0.0"

[init]
specs = true
ci = true
diagram_style = "mermaid"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]

[repo]
product_name = "decapod"
product_summary = "Decapod is the daemonless, local-first governance kernel behind AI coding agents. Agents call it on demand to converge on human intent, shape context before inference, enforce boundaries, and deliver proof-backed completion across concurrent multi-agent work."
architecture_direction = "cli"
product_type = "service_or_library"
done_criteria = "Decapod validate passes, required tests pass, and promotion-relevant artifacts are present."
base_branch = "master"
primary_languages = [
    "Rust",
    "rust",
]
detected_surfaces = [
    "cargo",
    "rust",
]
external_tracker = false
container_workspaces = true
backend = "local"
declared_capabilities = [
    "agent-helper",
    "authentication",
    "authorization",
    "background-processing",
    "control-plane",
    "event-driven",
    "external-integrations",
    "governance-kernel",
    "persistent-state",
    "scheduled-jobs",
]

[repo.migration_validation]
command = "cargo"
args = [
    "test",
    "--lib",
    "core::migration",
]
working_directory = "."
timeout_seconds = 120
expected_exit_code = 0

[governance]
protected_paths = []
approval_categories = ["destructive_operations"]

[proof]
validation_buildkite_preflights = true
commands = []

[proof.rust_workers]
reviewed_recipes_digest = "sha256:d6d9c7ff0ea68ac067f2c25e5c3544407d9ed00a63d021330061e47244cfe1c1"

[[proof.rust_workers.workers]]
name = "vega-native"
manifest = "assets/tools/vega-native/Cargo.toml"
features = []
metal_toolchain = true
timeout_seconds = 1800
runs = [
    { arguments = ["--collect-scientific-numerics"], proof_output = true },
    { arguments = ["--collect-readiness-shard", "--index", "0"], proof_output = true },
    { arguments = ["--collect-readiness-shard", "--index", "1"], proof_output = true },
    { arguments = ["--collect-readiness-shard", "--index", "2"], proof_output = true },
    { arguments = ["--collect-readiness-shard", "--index", "3"], proof_output = true },
    { arguments = ["--collect-readiness-shard", "--index", "4"], proof_output = true },
    { arguments = ["--collect-readiness-shard", "--index", "5"], proof_output = true },
    { arguments = ["--verify-scientific-collection"], proof_output = true },
]

[proof.required_profile]
id = "decapod.pr-readiness.v1"
reviewed_sources_digest = "sha256:a3329f8d432de8b5f42ae66202a3ed3c8e69efba9c98c28cac7e7ea87ecf1e27"

[custody]
isolation = "container"

[tracker]
provider = "decapod"

[context]
declared_sources = []

# Provider-attested acceptance trusts this configured Buildkite executor.
# It does not independently prove the keyless importer's plugin implementation
# or that remote pipeline settings remained unchanged. Candidate changes cannot
# authorize their own policy; activation requires maintainer acceptance.
[proof.ci_attested]
schema = "decapod.ci-attested-validation.v1"

