schema_version = "1.0.0"

[init]
specs = true
ci = true
diagram_style = "mermaid"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]

[repo]
_allow_entrypoint_version_drift = true
product_name = "decapod"
product_summary = "Decapod is the daemonless, local-first governance kernel behind AI coding agents. Agents call it on demand to converge on human intent, shape context before inference, enforce boundaries, and deliver proof-backed completion across concurrent multi-agent work."
architecture_direction = "cli"
product_type = "service_or_library"
done_criteria = "Decapod validate passes, required tests pass, and promotion-relevant artifacts are present."
base_branch = "master"
primary_languages = [
    "Rust",
    "rust",
]
detected_surfaces = [
    "cargo",
    "rust",
]
external_tracker = false
container_workspaces = true
backend = "local"
declared_capabilities = [
    "agent-helper",
    "authentication",
    "authorization",
    "background-processing",
    "control-plane",
    "event-driven",
    "external-integrations",
    "governance-kernel",
    "persistent-state",
    "scheduled-jobs",
]

[repo.migration_validation]
command = "cargo"
args = [
    "test",
    "--lib",
    "core::migration",
]
working_directory = "."
timeout_seconds = 120
expected_exit_code = 0

[governance]
protected_paths = []
approval_categories = ["destructive_operations"]

# Exceptional operations are denied unless explicitly granted here.
# Actor labels are cooperative; protect this policy with human code review.
[governance.rbac]
journal_repair_roles = ["maintainer"]
validation_bypass_roles = []

[governance.rbac.actor_roles]
operator = ["maintainer"]

# Laya is strictly opt-in. Only 'required' runs post-proof inference.
[laya]
mode = "disabled"

[proof]
validation_buildkite_preflights = false
validation_github_actions_preflights = true
commands = []

[proof.required_profile]
id = "decapod.pr-readiness.v1"
reviewed_sources_digest = "sha256:1c43f589843ed90763aaf1553e03332bde0fa052480d3e9ad7e9d1d663804329"

[custody]
isolation = "container"

[tracker]
provider = "decapod"

[context]
declared_sources = []
