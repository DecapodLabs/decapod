[package]
name = "decapod-napi"
version = "0.168.0"
edition = "2024"
license = "MIT"
description = "Native N-API (napi-rs) binding to the authoritative Decapod Rust governance kernel (#1277)."

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
decapod = { path = "../../.." }
napi = { version = "3.16", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "3.7"
serde_json = "1.0"

[build-dependencies]
napi-build = "2"

[profile.release]
strip = "none"
